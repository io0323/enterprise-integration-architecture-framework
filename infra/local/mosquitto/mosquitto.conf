# Mosquitto(iot profile。Framework 17.3・ADR-0039)。匿名接続を拒否する(Framework 12.3: 境界内でも認証必須)。
# パスワードと ACL のファイルは、起動のたびに mosquitto/start.sh がデバイスの一覧(mosquitto/devices.txt)から作る(ADR-0039 §3)。
# ローカルは平文で、パスワードで認証する(ADR-0008)。本番はデバイスごとの証明書の mTLS(TLS 化は #29)。
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl

# 溜め込みの上限(ADR-0039 §9)。iot-bridge の永続セッションに、止まっている間に溜める数とバイト数の上限。
# 耐えられる iot-bridge の停止の時間 = max_queued_messages ÷ 流入の速さ(前提の 10,000 台 × 1 件/分で約 29 分)。
# 上限を超えた分は捨てられる($SYS/broker/publish/messages/dropped で数える。デバイスには PUBACK が返っているので失われる)
max_queued_messages 300000
max_queued_bytes 268435456
max_inflight_messages 100
# 1 件の上限(iot-bridge の DevicePayloadDecoder.MAX_PAYLOAD_BYTES と同じ 16 KiB)
max_packet_size 16384
# retain を使わない($SYS の保存の数を、溜め込みの数として読めるように。retain を付けたクライアントは切断される)
retain_available false
# セッションの期限を付けない古いクライアント(MQTT v3.1.1)の後片付け
persistent_client_expiration 2d

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
