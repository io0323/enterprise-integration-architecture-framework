asyncapi: 3.0.0
info:
  title: Customer Events
  version: 1.0.0
  description: |
    SaaS(CRM)の顧客を Canonical Model の Customer に変えて出す Domain Event(INT-SALES-007。ADR-0036)。
    integration-flow が、Flow の定義(contracts/flows)に従って変換・振り分けし、Outbox + Debezium で発行する(ADR-0007)。
    パーティションキーは顧客 ID。Webhook と定期の同期のどちらから来ても、顧客ごとに版(sourceVersion)の新しいものだけを出す
    (古い版は出さない)。順序は保証しない(消費者は sourceVersion で新旧を判断できる)。
    ヘッダは CloudEvents binary mode(`ce_*`)と `traceparent`・`correlationid`。
    処理できないメッセージは `{topic}.dlq` に隔離する(Framework 6.5)。
  contact:
    name: team-integration
defaultContentType: avro/binary
servers:
  local:
    host: localhost:19092
    protocol: kafka
    description: ローカル(P03 の docker compose。ホスト用の EXTERNAL リスナー。コンテナ内からは kafka:9092)
channels:
  customerChanged:
    address: sales.customer.changed.v1
    messages:
      customerChanged:
        $ref: "#/components/messages/CustomerChanged"
operations:
  publishCustomerChanged:
    action: send
    channel:
      $ref: "#/channels/customerChanged"
    messages:
      - $ref: "#/channels/customerChanged/messages/customerChanged"
components:
  messages:
    CustomerChanged:
      name: CustomerChanged
      title: 顧客の変更
      contentType: avro/binary
      headers:
        $ref: "#/components/schemas/StandardHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "../avro/sales/CustomerChanged.avsc"
  schemas:
    StandardHeaders:
      type: object
      description: 全イベント共通のヘッダ(INTEGRATION_STANDARDS §2)
      required: [ce_id, ce_source, ce_type, ce_time, ce_specversion, traceparent, correlationid]
      properties:
        ce_id:
          type: string
          description: イベント ID(冪等消費のキー)
        ce_source:
          type: string
          description: 発行元
        ce_type:
          type: string
          description: イベント種別。トピック名から `.v{n}` を除いた値
        ce_time:
          type: string
          format: date-time
        ce_specversion:
          type: string
          const: "1.0"
        traceparent:
          type: string
          description: W3C Trace Context
        correlationid:
          type: string
          description: 業務トランザクション ID
