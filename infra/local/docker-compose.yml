# EIAF ローカル基盤(ADR-0003 / ADR-0015 / ADR-0016)
# - 起動は Makefile 経由: `make up PROFILE=<core|cdc|iot|file|b2b|chaos|order|saga|batch|saas>`(core は常に含まれる)
# - イメージは images.env(タグ + ダイジェスト)、秘密情報は .env(`make env` で生成)から読む。
# - ホスト側のポートは 127.0.0.1 の 19000〜19999 に割り当てる。一覧は README.md。
name: eiaf

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

# シェルのないイメージのヘルスチェック用に、busybox(静的リンク)を /probe に読み取り専用でマウントする(ADR-0016 §4)
x-probe-volume: &probe-volume
  type: image
  source: ${PROBE_IMAGE:?images.env を --env-file で指定してください}
  target: /probe

services:
  # ---------------------------------------------------------------- core: messaging
  kafka:
    image: ${KAFKA_IMAGE:?}
    profiles: [core]
    hostname: kafka
    environment:
      CLUSTER_ID: eiaf-local-kraft-cluster1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # PLAINTEXT: コンテナ間 / EXTERNAL: ホスト(アプリ・テスト)
      # TOXI_HOST / TOXI_INTERNAL: Toxiproxy 経由の専用リスナー(chaos profile)。advertised を Toxiproxy のアドレスにし、
      # メタデータ取得後の接続も Toxiproxy を通るようにする(ホスト: localhost:19094 / コンテナ: toxiproxy:19095)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092,TOXI_HOST://:9094,TOXI_INTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092,TOXI_HOST://localhost:19094,TOXI_INTERNAL://toxiproxy:19095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,TOXI_HOST:PLAINTEXT,TOXI_INTERNAL:PLAINTEXT
      # 単一ブローカー
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 命名規約外のトピックを作らせない(Framework 6.2)。トピックは各フェーズの初期化で明示的に作る
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports:
      - 127.0.0.1:19092:19092
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      <<: *healthcheck
      # CLI の JVM がブローカーの KAFKA_HEAP_OPTS を引き継がないよう、ヒープを小さく上書きする
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s

  apicurio:
    image: ${APICURIO_REGISTRY_IMAGE:?}
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: apicurio
      APICURIO_DATASOURCE_PASSWORD: ${APICURIO_DB_PASSWORD:?make env を実行してください}
      # 既定のグローバル互換性ルール(ADR-0014: 登録時は全版と FULL 互換)
      APICURIO_RULES_GLOBAL_COMPATIBILITY: FULL_TRANSITIVE
      APICURIO_RULES_GLOBAL_VALIDITY: FULL
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:19081
      JAVA_OPTS_APPEND: -XX:MaxRAMPercentage=60
    ports:
      - 127.0.0.1:19081:8080
    mem_limit: 640m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]

  # ---------------------------------------------------------------- cdc
  kafka-connect:
    # Debezium の公式イメージは使わず、images.env の apache/kafka に Maven Central の Debezium の Postgres コネクタと
    # Apicurio の Converter を載せて組み立てる(ADR-0016 §9。版と SHA-256 は Dockerfile で固定)
    build:
      context: ./images/kafka-connect
      args:
        KAFKA_IMAGE: ${KAFKA_IMAGE:?}
    # cdc: レガシーの受注表の CDC(コネクタ legacy-juchu。ADR-0026)。order: 注文のイベントを Outbox から発行する(ADR-0007)。
    # saga: Saga の参加者の返事を Outbox から発行する(コネクタ inventory-outbox など。ADR-0029)。
    # saas: 取り込みのトピックと Canonical の顧客のイベントを Outbox から発行する(コネクタ webhook-receiver-outbox・integration-flow-outbox)。
    # コネクタはどれも make up が登録する
    profiles: [cdc, order, saga, saas]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      apicurio:
        condition: service_healthy
      # cdc: レガシーの CDC の設定(publication・権限)ができてから起動する。make up --wait は、どのサービスも待たない 1 回だけの
      # コンテナが終わると失敗にするため、ここで待つ。order の profile では legacy-migrate がないので required: false
      legacy-migrate:
        condition: service_completed_successfully
        required: false
      # saga: 参加者の Outbox の表・publication・Debezium の CONNECT ができてから起動する(同じ理由)
      inventory-migrate:
        condition: service_completed_successfully
        required: false
      payment-migrate:
        condition: service_completed_successfully
        required: false
      shipping-migrate:
        condition: service_completed_successfully
        required: false
      # saas: 受け口と Flow の Outbox の表・publication・Debezium の CONNECT ができてから起動する(同じ理由)
      webhook-receiver-migrate:
        condition: service_completed_successfully
        required: false
      integration-flow-migrate:
        condition: service_completed_successfully
        required: false
    environment:
      # CONNECT_<NAME> は connect-distributed.properties の <name>(大文字 → 小文字、_ → .)。images/kafka-connect/connect-entrypoint.sh
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      # Connect の内部トピックと Consumer Group(業務トピックの命名規約の対象外。先頭の _ で区別する)
      CONNECT_GROUP_ID: debezium.connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect.configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect.offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # auto.create.topics.enable=false のため、コネクタの出力先トピックは Connect が明示的に作る(topic.creation.*)
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      # Apicurio の Avro Converter はイメージに含めている(plugin.path の apicurio-converter。レガシーの生の CDC で使う。ADR-0026)
      # コネクタの設定に秘密情報を平文で書かず、${env:VAR} で参照させる(Framework 12.2。ADR-0016 §7)。
      # 平文で書くと _connect.configs トピックと REST(GET /connectors/{name}/config)から読めてしまう
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - 127.0.0.1:19083:8083
    mem_limit: 1g
    healthcheck:
      <<: *healthcheck
      # apache/kafka には curl がないため、BusyBox の wget を使う
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/connector-plugins"]
      # 起動時のグループ参加(NotCoordinator の再試行)で REST の待ち受けまで 1 分以上かかることがある
      start_period: 90s

  # CDC の監視(P06 ④。docs/runbooks/cdc-outbox-lag.md)。Prometheus(core)が scrape し、アラートは prometheus/rules/cdc.yml
  # レプリケーションスロット(wal_status・safe_wal_size・位置)と設定(max_slot_wal_keep_size)を出す。接続は pg_monitor だけのユーザー
  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:?}
    profiles: [cdc, order, saga, saas]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_DB_PASSWORD:?}
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/metrics"]

  # トピックのオフセットと Consumer Group の lag(P06 ④。P07 の Consumer の DLQ・lag のアラートにも使う。ADR-0028 §5)
  kafka-exporter:
    image: ${KAFKA_EXPORTER_IMAGE:?}
    profiles: [cdc, order, saga, batch, saas, iot]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - *probe-volume
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9308/metrics"]

  # ---------------------------------------------------------------- legacy-sim(P06 ⑤。ADR-0026)
  # レガシー基幹の模擬(改修できないレガシー)。イメージは services/legacy-sim/app/Dockerfile で、中身は make up PROFILE=cdc が先に作る
  # マイグレーション(1 回だけ動いて終わる): レガシーの表と、DBA の CDC の設定(publication・権限・signal 表)。
  # コネクタ legacy-juchu(kafka-connect/legacy-juchu.json)は、これが終わった後に make up が登録する
  legacy-migrate:
    build: &legacy-sim-build
      context: ../../services/legacy-sim/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [cdc]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEGACY_SIM_DB_URL: jdbc:postgresql://postgres:5432/legacy_sim
      LEGACY_SIM_DB_PASSWORD: ${LEGACY_SIM_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: legacy-sim
    mem_limit: 256m
    restart: "no"

  # レガシーのアプリの操作(make legacy-simulate ARGS="seed 10")。常駐しないため、make up では起動しない専用の profile に置く。
  # アプリのロールのパスワードだけを渡す
  legacy-sim:
    build: *legacy-sim-build
    # make up PROFILE=cdc で起動した postgres に接続する(この profile だけで動かすため depends_on は書かない)
    profiles: [legacy-sim-cli]
    environment:
      LEGACY_SIM_DB_URL: jdbc:postgresql://postgres:5432/legacy_sim
      LEGACY_SIM_APP_DB_PASSWORD: ${LEGACY_SIM_APP_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: legacy-sim
      EIA_LOG_FORMAT: console
    mem_limit: 256m
    restart: "no"

  # アプリが書くトピックを、kafka/topics.conf のとおりに作って終わる(compacted の出力・DLQ の保持期間。auto.create.topics.enable=false)
  kafka-topics:
    image: ${KAFKA_IMAGE:?}
    # cdc: ACL の出力と DLQ。order: 注文 Saga のコマンド・返信と DLQ。saga: 参加者のコマンドの DLQ(ADR-0028・ADR-0029)。
    # batch: 注文のイベント(保持 14 日)と DLQ(ADR-0031 §7)。saas: 取り込みのトピック(保持 7 日)・Canonical の顧客のイベントと DLQ(ADR-0035 §3)。
    # iot: テレメトリのイベントと DLQ(ADR-0039)
    profiles: [cdc, order, saga, batch, saas, iot]
    entrypoint: ["/bin/bash", "/topics/create-topics.sh", "kafka:9092", "/topics/topics.conf"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka:/topics:ro
    mem_limit: 256m
    restart: "no"

  # レガシーの受注の CDC の Anti-Corruption Layer(P06 ⑤b。ADR-0026)。生の CDC を読み、sales.legacy-order.changed.v1 と DLQ に書く。
  # 書き込むイベントのスキーマ(契約)を schema-publish が登録し、トピックを kafka-topics が作ってから起動する
  legacy-order-acl:
    build:
      context: ../../services/legacy-order-acl/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [cdc]
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      # 照合が読むレガシーの表と権限(V3)
      legacy-migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    environment:
      LEGACY_ORDER_ACL_KAFKA_BOOTSTRAP: kafka:9092
      LEGACY_ORDER_ACL_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      # 照合(ADR-0027)。読み取り専用のロール eiaf_reconcile(postgres/init/40-reconcile.sh)。ローカルは確かめやすいよう 2 分ごと(既定 15 分)
      LEGACY_ORDER_ACL_RECONCILE_DB_URL: jdbc:postgresql://postgres:5432/legacy_sim
      LEGACY_RECONCILE_DB_PASSWORD: ${LEGACY_RECONCILE_DB_PASSWORD:?make env を実行してください}
      LEGACY_RESYNC_DB_PASSWORD: ${LEGACY_RESYNC_DB_PASSWORD:?make env を実行してください}
      LEGACY_ORDER_ACL_RECONCILE_INTERVAL: 2m
      OTEL_SERVICE_NAME: legacy-order-acl
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # ---------------------------------------------------------------- saga(P07。ADR-0029)
  # 注文 Saga の参加者。イメージは services/<name>/app/Dockerfile で、中身は make up PROFILE=saga が先に作る(installDist)。
  # 在庫の引当(inventory-service)。マイグレーション(1 回だけ動いて終わる)は所有者のパスワードを渡す唯一のコンテナ(ADR-0024 §2)
  inventory-migrate:
    build: &inventory-build
      context: ../../services/inventory/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [saga]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_service
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: inventory-service
    mem_limit: 256m
    restart: "no"

  # コマンド(inventory.stock.cmd-*)を読み、返事を Outbox に書く。返事は Debezium(コネクタ inventory-outbox)が発行する。
  # 返事のスキーマを schema-publish が登録し、DLQ のトピックを kafka-topics が作ってから起動する。アプリのロールのパスワードだけを渡す
  inventory-service:
    build: *inventory-build
    profiles: [saga]
    command: ["serve"]
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_service
      INVENTORY_APP_DB_PASSWORD: ${INVENTORY_APP_DB_PASSWORD:?make env を実行してください}
      INVENTORY_KAFKA_BOOTSTRAP: kafka:9092
      INVENTORY_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
    # 開発機で core + order + saga を同時に動かすため、order-service(384m)より小さくする(P07 の計画)
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # 注文の分析のバッチ(batch-etl。P08。ADR-0030・ADR-0031)。マイグレーションは所有者のパスワードを渡す唯一のコンテナ
  batch-etl-migrate:
    build: &batch-etl-build
      context: ../../services/batch-etl/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [batch]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BATCH_ETL_DB_URL: jdbc:postgresql://postgres:5432/batch_etl
      BATCH_ETL_DB_PASSWORD: ${BATCH_ETL_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: batch-etl
    mem_limit: 256m
    restart: "no"

  # 日次の DAG(毎日 01:00 JST に前日の分。SLA は 06:00 JST)と週次の照合(月曜 07:00 JST)を動かす。アプリのロールのパスワードだけを渡す。
  # 注文のイベントは order profile の order-service が書く(make up PROFILE="order batch")。照合は Gateway 経由で order-service の日次の集計を読む
  batch-etl:
    build: *batch-etl-build
    profiles: [batch]
    command: ["serve"]
    depends_on:
      batch-etl-migrate:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      # 起動の順序だけ(売上ファイルのバケットを作ってから)。起動の後に置き場が止まっても batch-etl は動き続ける
      seaweedfs-init:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      BATCH_ETL_DB_URL: jdbc:postgresql://postgres:5432/batch_etl
      BATCH_ETL_APP_DB_PASSWORD: ${BATCH_ETL_APP_DB_PASSWORD:?make env を実行してください}
      BATCH_ETL_KAFKA_BOOTSTRAP: kafka:9092
      BATCH_ETL_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      BATCH_ETL_GATEWAY_URL: http://apisix:9080
      # トークンの iss は Keycloak の KC_HOSTNAME(http://localhost:19180)。Gateway・order-service の検証と同じ
      BATCH_ETL_TOKEN_URL: http://keycloak:8080/realms/eiaf/protocol/openid-connect/token
      BATCH_ETL_CLIENT_SECRET: ${EIAF_BATCH_ETL_CLIENT_SECRET:?make env を実行してください}
      # 日次の売上ファイル(INT-SALES-004。ADR-0031 §8)。受け口(inbox/sales-daily/)に書くだけの identity で置く。
      # 置き場が止まっても、売上ファイルの DAG が失敗するだけで、注文の取り込みの DAG とその SLA には影響しない(P09 ⑥ の承認の条件 2)
      BATCH_ETL_FILE_S3_ENDPOINT: http://seaweedfs:8333
      BATCH_ETL_FILE_S3_ACCESS_KEY: ${FILE_BATCH_ETL_S3_ACCESS_KEY:?make env を実行してください}
      BATCH_ETL_FILE_S3_SECRET_KEY: ${FILE_BATCH_ETL_S3_SECRET_KEY:?}
      OTEL_SERVICE_NAME: batch-etl
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # ファイル授受(file-exchange。P09。ADR-0032)。マイグレーションは所有者のパスワードを渡す唯一のコンテナ
  file-exchange-migrate:
    build: &file-exchange-build
      context: ../../services/file-exchange/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [file]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FILE_EXCHANGE_DB_URL: jdbc:postgresql://postgres:5432/file_exchange
      FILE_EXCHANGE_DB_PASSWORD: ${FILE_EXCHANGE_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: file-exchange
    mem_limit: 256m
    restart: "no"

  # 受け口(バケット eiaf-file-exchange の inbox/sales-daily/)に届いたファイルを検査して archive / quarantine に移し、合格のファイルを
  # 取引先(sftp-b2b の partner01)に PGP で暗号化・署名して送る。アプリのロールのパスワードだけを渡す。
  # - 取引先の台帳(file-exchange/partners.json)には秘密情報の名前だけを書き、値は secrets/ のファイルを _FILE で渡す
  # - 鍵(secrets/*。0600)を読めるよう、ホストの利用者の uid で動かす(Makefile の EIAF_UID。root では make up が止まる)
  # - 取引先の SFTP には依存しない(止まっていても受け取りは動き、配送は取引先ごとの Circuit Breaker と再実行で続ける)
  file-exchange:
    build: *file-exchange-build
    profiles: [file]
    command: ["serve"]
    user: "${EIAF_UID:-65532}:${EIAF_GID:-65532}"
    depends_on:
      file-exchange-migrate:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      FILE_EXCHANGE_DB_URL: jdbc:postgresql://postgres:5432/file_exchange
      FILE_EXCHANGE_APP_DB_PASSWORD: ${FILE_EXCHANGE_APP_DB_PASSWORD:?make env を実行してください}
      FILE_EXCHANGE_S3_ENDPOINT: http://seaweedfs:8333
      FILE_EXCHANGE_S3_ACCESS_KEY: ${FILE_EXCHANGE_S3_ACCESS_KEY:?make env を実行してください}
      FILE_EXCHANGE_S3_SECRET_KEY: ${FILE_EXCHANGE_S3_SECRET_KEY:?}
      FILE_EXCHANGE_PARTNERS_FILE: /config/partners.json
      # 自社の署名の鍵(make pgp-keys が GnuPG で作る)
      FILE_EXCHANGE_PGP_SECRET_KEY_FILE: /secrets/pgp-eiaf.sec.asc
      FILE_EXCHANGE_PGP_PASSPHRASE_FILE: /secrets/pgp-eiaf.passphrase
      # 取引先 partner01 の鍵(台帳に書いた名前)
      PARTNER01_SFTP_KNOWN_HOSTS_FILE: /secrets/sftp-b2b.known_hosts
      PARTNER01_SFTP_KEY_FILE: /secrets/sftp-b2b
      PARTNER01_PGP_PUBLIC_KEY_FILE: /secrets/pgp-partner01.pub.asc
      # 到着の確認の間隔・取引先の Circuit Breaker の Open の期間・配送のリトライの最初の待ち時間。E2E では tests/e2e/e2e.env で短くする
      # (make up E2E=1。理由は e2e.env のコメント)
      FILE_EXCHANGE_POLL_INTERVAL: ${FILE_EXCHANGE_POLL_INTERVAL:-30s}
      FILE_EXCHANGE_SFTP_OPEN_DURATION: ${FILE_EXCHANGE_SFTP_OPEN_DURATION:-30s}
      FILE_EXCHANGE_DELIVER_RETRY_DELAY: ${FILE_EXCHANGE_DELIVER_RETRY_DELAY:-5s}
      OTEL_SERVICE_NAME: file-exchange
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
      - ./file-exchange/partners.json:/config/partners.json:ro
      - ./secrets/pgp-eiaf.sec.asc:/secrets/pgp-eiaf.sec.asc:ro
      - ./secrets/pgp-eiaf.passphrase:/secrets/pgp-eiaf.passphrase:ro
      - ./secrets/pgp-partner01.pub.asc:/secrets/pgp-partner01.pub.asc:ro
      - ./secrets/sftp-b2b.known_hosts:/secrets/sftp-b2b.known_hosts:ro
      - ./secrets/sftp-b2b:/secrets/sftp-b2b:ro
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # ---------------------------------------------------------------- saas(P10。ADR-0035・ADR-0036)
  # SaaS(CRM)の模擬。外部の契約 contracts/external/crm-api.v1.yaml を実装し、顧客の変更を署名した Webhook で Gateway に送る。
  # 状態はメモリの上だけ(再起動で消える)。ホストの 19280 は CRM の API と管理の API(make verify・E2E が顧客を作る・変える)。
  # 署名の鍵はファイル(secrets/crm-webhook/sender-*)を送るたびに読む(差し替えに再起動は要らない。docs/runbooks/webhook-secret-rotation.md)
  saas-mock:
    build:
      context: ../../services/saas-mock/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [saas]
    user: "${EIAF_UID:-65532}:${EIAF_GID:-65532}"
    depends_on:
      apisix:
        condition: service_healthy
    environment:
      SAAS_MOCK_API_TOKEN: ${SAAS_MOCK_API_TOKEN:?make env を実行してください}
      SAAS_MOCK_ADMIN_TOKEN: ${SAAS_MOCK_ADMIN_TOKEN:?make env を実行してください}
      # Gateway の公開パス(ADR-0035 §5)。署名のルートで受け口(webhook-receiver)に届く
      SAAS_MOCK_WEBHOOK_URL: http://apisix:9080/sales/v1/webhooks/crm
      SAAS_MOCK_WEBHOOK_SECRET_FILE: /secrets/crm-webhook/sender-current
      SAAS_MOCK_WEBHOOK_SECRET_NEXT_FILE: /secrets/crm-webhook/sender-next
      # 再送の間隔(既定は 5s,30s,2m,10m,1h,3h)。E2E では tests/e2e/e2e.env で短くする
      SAAS_MOCK_WEBHOOK_RETRY: ${SAAS_MOCK_WEBHOOK_RETRY:-5s,30s,2m,10m,1h,3h}
      SAAS_MOCK_RATE_LIMIT: ${SAAS_MOCK_RATE_LIMIT:-20/1s}
      SAAS_MOCK_SEED_CUSTOMERS: "5"
    ports:
      - 127.0.0.1:19280:8080
    volumes:
      - *probe-volume
      - ./secrets/crm-webhook:/secrets/crm-webhook:ro
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]

  webhook-receiver-migrate:
    build: &webhook-receiver-build
      context: ../../services/webhook-receiver/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [saas]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WEBHOOK_RECEIVER_DB_URL: jdbc:postgresql://postgres:5432/webhook_receiver
      WEBHOOK_RECEIVER_DB_PASSWORD: ${WEBHOOK_RECEIVER_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: webhook-receiver
    mem_limit: 256m
    restart: "no"

  # CRM の Webhook の受け口(INT-SALES-005)。署名を検証し、受け取りの記録と取り込みのトピックへの Outbox を同じトランザクションで書いて 204 を返す。
  # 発行は Debezium(コネクタ webhook-receiver-outbox)。API(8443)は Gateway の証明書の mTLS だけで受ける(ADR-0024 §6)。
  # ホストの 19444 は、mTLS なしの直接接続を拒否することの検査(make verify)のためだけに公開する。
  # 署名の鍵はファイル(secrets/crm-webhook/receiver-*)を要求のたびに読む。鍵と証明書(0600)を読めるよう、ホストの利用者の uid で動かす
  webhook-receiver:
    build: *webhook-receiver-build
    profiles: [saas]
    command: ["serve"]
    user: "${EIAF_UID:-65532}:${EIAF_GID:-65532}"
    depends_on:
      webhook-receiver-migrate:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    environment:
      WEBHOOK_RECEIVER_DB_URL: jdbc:postgresql://postgres:5432/webhook_receiver
      WEBHOOK_RECEIVER_APP_DB_PASSWORD: ${WEBHOOK_RECEIVER_APP_DB_PASSWORD:?make env を実行してください}
      WEBHOOK_RECEIVER_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      WEBHOOK_RECEIVER_CRM_SECRET_FILE: /secrets/crm-webhook/receiver-current
      WEBHOOK_RECEIVER_CRM_SECRET_PREVIOUS_FILE: /secrets/crm-webhook/receiver-previous
      WEBHOOK_RECEIVER_TLS_CERT_FILE: /certs/webhook-receiver.crt
      WEBHOOK_RECEIVER_TLS_KEY_FILE: /certs/webhook-receiver.key
      WEBHOOK_RECEIVER_TLS_CLIENT_CA_FILE: /certs/ca.crt
      WEBHOOK_RECEIVER_TLS_ALLOWED_CLIENTS: apisix
      OTEL_SERVICE_NAME: webhook-receiver
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - 127.0.0.1:19444:8443
    volumes:
      # CA の鍵(ca.key)は渡さない
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/webhook-receiver.crt:/certs/webhook-receiver.crt:ro
      - ./certs/webhook-receiver.key:/certs/webhook-receiver.key:ro
      - ./secrets/crm-webhook:/secrets/crm-webhook:ro
      - *probe-volume
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  integration-flow-migrate:
    build: &integration-flow-build
      context: ../../services/integration-flow/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [saas]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTEGRATION_FLOW_DB_URL: jdbc:postgresql://postgres:5432/integration_flow
      INTEGRATION_FLOW_DB_PASSWORD: ${INTEGRATION_FLOW_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: integration-flow
    mem_limit: 256m
    restart: "no"

  # iPaaS 風の Flow の実行(ADR-0036)。取り込みのトピック(Consumer Group integration-flow.webhook-ingest)と CRM の API の定期の同期から、
  # Canonical の顧客のイベント(sales.customer.changed.v1。INT-SALES-007)を Outbox に書く。発行は Debezium(コネクタ integration-flow-outbox)。
  # Flow の定義はイメージに含めた contracts/flows(起動時に検証し、誤りがあれば起動しない)。取り込みのトピックと DLQ を kafka-topics が作ってから起動する
  integration-flow:
    build: *integration-flow-build
    profiles: [saas]
    command: ["serve"]
    depends_on:
      integration-flow-migrate:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      saas-mock:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    environment:
      INTEGRATION_FLOW_DB_URL: jdbc:postgresql://postgres:5432/integration_flow
      INTEGRATION_FLOW_APP_DB_PASSWORD: ${INTEGRATION_FLOW_APP_DB_PASSWORD:?make env を実行してください}
      INTEGRATION_FLOW_KAFKA_BOOTSTRAP: kafka:9092
      INTEGRATION_FLOW_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      INTEGRATION_FLOW_CRM_API_URL: http://saas-mock:8080
      INTEGRATION_FLOW_CRM_API_TOKEN: ${SAAS_MOCK_API_TOKEN:?make env を実行してください}
      # 定期の同期の間隔(Flow の every を上書きする)。ローカルで確かめやすいよう 1 分。E2E では tests/e2e/e2e.env で短くする
      INTEGRATION_FLOW_POLL_INTERVAL: ${INTEGRATION_FLOW_POLL_INTERVAL:-1m}
      # イメージの Flow に足して読む Flow(既定は空のディレクトリ。E2E では tests/e2e/flows。ADR-0036 の改訂履歴)
      INTEGRATION_FLOW_EXTRA_FLOWS_DIR: /flows/extra
      OTEL_SERVICE_NAME: integration-flow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
      - ${INTEGRATION_FLOW_EXTRA_FLOWS:-./integration-flow/extra-flows}:/flows/extra:ro
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # 決済の承認(payment-service。模擬。外部の決済の代行は呼ばない)。マイグレーションは所有者のパスワードを渡す唯一のコンテナ
  payment-migrate:
    build: &payment-build
      context: ../../services/payment/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [saga]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_service
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: payment-service
    mem_limit: 256m
    restart: "no"

  # コマンド(payment.payment.cmd-*)を読み、返事を Outbox に書く。返事は Debezium(コネクタ payment-outbox)が発行する。
  # 返事のスキーマを schema-publish が登録し、DLQ のトピックを kafka-topics が作ってから起動する。アプリのロールのパスワードだけを渡す
  payment-service:
    build: *payment-build
    profiles: [saga]
    command: ["serve"]
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_service
      PAYMENT_APP_DB_PASSWORD: ${PAYMENT_APP_DB_PASSWORD:?make env を実行してください}
      PAYMENT_KAFKA_BOOTSTRAP: kafka:9092
      PAYMENT_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      # 模擬の承認の上限(ADR-0029 §7。既定は 1,000,000 円)。E2E の決済の失敗は、上限を超える金額の注文で作る
      PAYMENT_AUTHORIZATION_LIMIT: "1000000"
      PAYMENT_AUTHORIZATION_CURRENCY: JPY
      OTEL_SERVICE_NAME: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
    # 開発機で core + order + saga を同時に動かすため、order-service(384m)より小さくする(P07 の計画)
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # 出荷(shipping-service。模擬。運送は手配しない)。マイグレーションは所有者のパスワードを渡す唯一のコンテナ
  shipping-migrate:
    build: &shipping-build
      context: ../../services/shipping/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [saga]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHIPPING_DB_URL: jdbc:postgresql://postgres:5432/shipping_service
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: shipping-service
    mem_limit: 256m
    restart: "no"

  # コマンド(shipping.shipment.cmd-*)を読み、返事を Outbox に書く。返事は Debezium(コネクタ shipping-outbox)が発行する。
  # 返事のスキーマを schema-publish が登録し、DLQ のトピックを kafka-topics が作ってから起動する。アプリのロールのパスワードだけを渡す
  shipping-service:
    build: *shipping-build
    profiles: [saga]
    command: ["serve"]
    depends_on:
      shipping-migrate:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    environment:
      SHIPPING_DB_URL: jdbc:postgresql://postgres:5432/shipping_service
      SHIPPING_APP_DB_PASSWORD: ${SHIPPING_APP_DB_PASSWORD:?make env を実行してください}
      SHIPPING_KAFKA_BOOTSTRAP: kafka:9092
      SHIPPING_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      # 模擬の出荷できる国(ADR-0029 §7)。E2E の出荷の拒否は、JP 以外の届け先の注文で作る
      SHIPPING_SUPPORTED_COUNTRIES: JP
      OTEL_SERVICE_NAME: shipping-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
    # 開発機で core + order + saga を同時に動かすため、order-service(384m)より小さくする(P07 の計画)
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # ---------------------------------------------------------------- iot(P11。ADR-0039)
  # パスワードと ACL のファイルを、デバイスの一覧(mosquitto/devices.txt)と secrets/mqtt/device-passwords から起動のたびに作り直す
  # (mosquitto/start.sh。ボリュームには置かない)。デバイスは自分のトピックにだけ書け、iot-bridge は読むだけ、eiaf-monitor は $SYS だけ
  mosquitto:
    image: ${MOSQUITTO_IMAGE:?}
    profiles: [iot]
    entrypoint: ["sh", "/mosquitto/start.sh"]
    environment:
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?make env を実行してください}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?make env を実行してください}
    ports:
      - 127.0.0.1:19883:1883
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/start.sh:/mosquitto/start.sh:ro
      - ./mosquitto/devices.txt:/mosquitto/devices.txt:ro
      - ./secrets/mqtt/device-passwords:/mosquitto/secrets/device-passwords:ro
      - mosquitto-data:/mosquitto/data
    # 溜め込みの上限(max_queued_bytes 256 MiB。ADR-0039 §9)に届いても動けるだけのメモリ
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -u eiaf-monitor -P "$$MQTT_MONITOR_PASSWORD" -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null

  # Mosquitto の $SYS(溜め込みの数・捨てた数)を Prometheus に出す(ADR-0039 §9)。iot-bridge が止まっている間こそ要るので別に動かす
  mosquitto-exporter:
    image: ${TELEGRAF_IMAGE:?}
    profiles: [iot]
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?make env を実行してください}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    # Telegraf の実行ファイルは 326 MB(全プラグイン入り)。動いているときの RSS は 40 MB ほどだが、起動で実行ファイルの多くのページを読むので、
    # 256m 以下では amd64 で読み込みが詰まって OOM で止まる(#159・#160 の CI)。ADR-0039 §9
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9273/metrics"]

  # MQTT → Kafka の橋渡し(P11 ⑤。ADR-0039)。イメージは services/iot-bridge/app/Dockerfile で、中身は make up PROFILE=iot が先に作る。
  # 書き込むイベントのスキーマ(契約)を schema-publish が登録し、トピックを kafka-topics が作ってから起動する。
  # 永続セッションの識別子(IOT_BRIDGE_MQTT_CLIENT_ID)を変えると、Broker の溜め込みを引き継がない
  iot-bridge:
    build:
      context: ../../services/iot-bridge/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [iot]
    command: ["serve"]
    depends_on:
      mosquitto:
        condition: service_healthy
      schema-publish:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    environment:
      IOT_BRIDGE_KAFKA_BOOTSTRAP: kafka:9092
      IOT_BRIDGE_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      IOT_BRIDGE_MQTT_HOST: mosquitto
      IOT_BRIDGE_MQTT_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: iot-bridge
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - *probe-volume
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # ---------------------------------------------------------------- file / b2b / order
  # S3 互換オブジェクトストレージ(ADR-0015)。master・volume・filer・S3 ゲートウェイを 1 プロセスで動かす
  # order profile では、order-service が監査のアンカーを保存する(ADR-0017 §5)。batch profile では、batch-etl が日次の売上ファイルを置く(P09)
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?}
    profiles: [file, b2b, order, batch]
    # S3 の認証情報(.env)から設定ファイルを生成してから起動する。
    # - eiaf: 管理者(バケットとポリシーの作成用)
    # - eiaf-audit-{service}: サービスごとの監査のアンカーの書込み用(Issue #43。ADR-0017 §7)。Write は anchors/{service}/ の下だけ
    #   (プレフィックスに限った Write はバケットの管理操作も含まない)。自分のプレフィックスの Legal Hold と削除は、seaweedfs-init が
    #   設定するバケットポリシーで拒否する。アンカーを書くサービスを足すときは、ここ・env.example・バケットポリシーに同じ形で足す
    # - eiaf-audit-verify: 監査の検査(make audit-verify)専用。バケット eiaf-audit の Read / List だけ
    # - eiaf-file-batch-etl: 日次の売上ファイルの書き手(batch-etl)。バケット eiaf-file-exchange の受け口 inbox/sales-daily/ に Write だけ
    # - eiaf-file-exchange: ファイル授受(file-exchange)。バケット eiaf-file-exchange の Read / List / Write(検査と移動)。
    #   ファイル授受の 2 つの identity のバケットの管理操作は、seaweedfs-init が設定するバケットポリシーで拒否する(P09 ⑥)
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /etc/seaweedfs &&
        printf '{"identities":[{"name":"eiaf","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"eiaf-audit-order","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:eiaf-audit","List:eiaf-audit","Write:eiaf-audit/anchors/order/*"]},{"name":"eiaf-audit-verify","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:eiaf-audit","List:eiaf-audit"]},{"name":"eiaf-file-batch-etl","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Write:eiaf-file-exchange/inbox/sales-daily/*"]},{"name":"eiaf-file-exchange","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:eiaf-file-exchange","List:eiaf-file-exchange","Write:eiaf-file-exchange"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$ORDER_AUDIT_S3_ACCESS_KEY" "$$ORDER_AUDIT_S3_SECRET_KEY"
        "$$AUDIT_VERIFY_S3_ACCESS_KEY" "$$AUDIT_VERIFY_S3_SECRET_KEY"
        "$$FILE_BATCH_ETL_S3_ACCESS_KEY" "$$FILE_BATCH_ETL_S3_SECRET_KEY" "$$FILE_EXCHANGE_S3_ACCESS_KEY" "$$FILE_EXCHANGE_S3_SECRET_KEY"
        > /etc/seaweedfs/s3.json &&
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
        -master.volumeSizeLimitMB=256 -volume.max=32
        -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?make env を実行してください}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      ORDER_AUDIT_S3_ACCESS_KEY: ${ORDER_AUDIT_S3_ACCESS_KEY:?make env を実行してください}
      ORDER_AUDIT_S3_SECRET_KEY: ${ORDER_AUDIT_S3_SECRET_KEY:?}
      AUDIT_VERIFY_S3_ACCESS_KEY: ${AUDIT_VERIFY_S3_ACCESS_KEY:?make env を実行してください}
      AUDIT_VERIFY_S3_SECRET_KEY: ${AUDIT_VERIFY_S3_SECRET_KEY:?}
      FILE_BATCH_ETL_S3_ACCESS_KEY: ${FILE_BATCH_ETL_S3_ACCESS_KEY:?make env を実行してください}
      FILE_BATCH_ETL_S3_SECRET_KEY: ${FILE_BATCH_ETL_S3_SECRET_KEY:?}
      FILE_EXCHANGE_S3_ACCESS_KEY: ${FILE_EXCHANGE_S3_ACCESS_KEY:?make env を実行してください}
      FILE_EXCHANGE_S3_SECRET_KEY: ${FILE_EXCHANGE_S3_SECRET_KEY:?}
    ports:
      - 127.0.0.1:19333:8333
    volumes:
      - seaweedfs-data:/data
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]

  # 監査のアンカー用のバケット(eiaf-audit。Object Lock)と、ファイル授受のバケット(eiaf-file-exchange。P09 ⑥)と、
  # それぞれのバケットポリシーを作る(ADR-0017・ADR-0032)。make up のたびに実行し、終えたら待機する。
  # 完了はヘルスチェック(完了のファイル)で示す。終了させると、Compose v2.38 の up --wait が失敗として扱うため
  seaweedfs-init:
    image: ${AWS_CLI_IMAGE:?}
    profiles: [file, b2b, order, batch]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["bash", "/init/init-audit-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?make env を実行してください}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./seaweedfs/init-audit-bucket.sh:/init/init-audit-bucket.sh:ro
      - ./seaweedfs/audit-bucket-policy.json:/init/audit-bucket-policy.json:ro
      - ./seaweedfs/init-file-bucket.sh:/init/init-file-bucket.sh:ro
      - ./seaweedfs/file-bucket-policy.json:/init/file-bucket-policy.json:ro
    mem_limit: 256m
    restart: "no"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "test", "-f", "/tmp/initialized"]

  # SFTP(file profile。社内システムとのファイル授受)。公開鍵認証のみ
  sftp:
    image: ${SFTP_IMAGE:?}
    profiles: [file]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      USER_NAME: eiaf-file
      PUBLIC_KEY_FILE: /keys/sftp-file.pub
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    ports:
      - 127.0.0.1:19222:2222
    volumes:
      - ./secrets/sftp-file.pub:/keys/sftp-file.pub:ro
      - ./sftp/10-directories.sh:/custom-cont-init.d/10-directories.sh:ro
      - sftp-data:/config
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]

  # SFTP(b2b profile。取引先向け。ADR-0008 で B2B のプロトコルは SFTP のみ)。社内向けの sftp とは利用者・鍵・保存領域を分ける。
  # file profile では、file-exchange が日次の売上ファイルを送る取引先(partner01)の代わり(P09。ADR-0032 §8)。
  # ホスト鍵は make env が作ったもの(secrets/sftp-b2b-host-key)を起動時に入れる。接続する側は known_hosts でこの鍵に固定する
  sftp-b2b:
    image: ${SFTP_IMAGE:?}
    profiles: [b2b, file]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      USER_NAME: partner01
      PUBLIC_KEY_FILE: /keys/sftp-b2b.pub
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    ports:
      - 127.0.0.1:19223:2222
    volumes:
      - ./secrets/sftp-b2b.pub:/keys/sftp-b2b.pub:ro
      - ./secrets/sftp-b2b-host-key:/keys/host/ssh_host_ed25519_key:ro
      - ./secrets/sftp-b2b-host-key.pub:/keys/host/ssh_host_ed25519_key.pub:ro
      - ./sftp/10-directories.sh:/custom-cont-init.d/10-directories.sh:ro
      - ./sftp/20-host-key.sh:/custom-cont-init.d/20-host-key.sh:ro
      - sftp-b2b-data:/config
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]

  # ---------------------------------------------------------------- chaos
  # 障害注入(Framework 13 / P04b・P14)。proxies は toxiproxy/toxiproxy.json、toxic は API(:19474)で入れる
  toxiproxy:
    image: ${TOXIPROXY_IMAGE:?}
    profiles: [chaos]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:19474:8474
      - 127.0.0.1:19094:19094
      - 127.0.0.1:19433:19433
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      # イメージ同梱の CLI で API(:8474)に問い合わせる
      test: ["CMD", "/toxiproxy-cli", "list"]

  # ---------------------------------------------------------------- order(P05。ADR-0024)
  # order-service のイメージ(services/order/app/Dockerfile)。中身は installDist の出力で、make up PROFILE=order が先に作る
  # マイグレーション(1 回だけ動いて終わる)。DB の所有者のパスワードを渡すのはこのコンテナだけ(ADR-0024 §2)
  order-migrate:
    build: &order-build
      context: ../../services/order/app
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    profiles: [order]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_service
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?make env を実行してください}
      OTEL_SERVICE_NAME: order-service
    mem_limit: 256m
    restart: "no"

  # 契約の Avro スキーマを Schema Registry に登録して終わる(make schemas と同じ。ADR-0025 §2)。
  # order-service は書き込むイベントのスキーマ ID を起動時に解決し、解決するまで ready にならないため、登録の完了を待ってから起動する(ADR-0025 §3)
  schema-publish:
    build:
      context: ../../tools/schema-publish
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:?}
    # cdc: legacy-order-acl が書くイベントのスキーマ(ADR-0026)。order: order-service のイベント。saga: 参加者の返事(ADR-0029)。
    # batch: batch-etl が読む注文のイベントの書き手のスキーマ(ADR-0031)。saas: 取り込みと Canonical の顧客のイベント(ADR-0035・ADR-0036)。
    # iot: テレメトリのイベント(ADR-0039)
    profiles: [order, cdc, saga, batch, saas, iot]
    command: ["--registry", "http://apicurio:8080/apis/registry/v3", "--root", "/repo"]
    depends_on:
      apicurio:
        condition: service_healthy
    volumes:
      - ../../contracts:/repo/contracts:ro
    mem_limit: 256m
    restart: "no"

  # リクエストの処理(serve)。マイグレーションが成功してから起動する。アプリのロールのパスワードだけを渡す(ADR-0024 §2)
  # - API(8443)は mTLS だけで受ける(クライアント証明書は開発用 CA の署名と SAN の許可の一覧。ADR-0024 §6)。
  #   ホストの 19443 は、mTLS なしの直接接続を拒否することの検査(make verify)と調査のためだけに公開する
  # - ヘルスチェック(8081)は平文で、コンテナの外には公開しない
  # - 鍵(certs/*.key。0600)を読めるよう、ホストの利用者の uid で動かす(Makefile の EIAF_UID。root では make up が止まる)
  order-service:
    build: *order-build
    profiles: [order]
    command: ["serve"]
    user: "${EIAF_UID:-65532}:${EIAF_GID:-65532}"
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      schema-publish:
        condition: service_completed_successfully
      # 注文 Saga の返信のトピックと DLQ ができてから、返信を読み始める(ADR-0029)
      kafka-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
      # 監査のアンカーのバケット(eiaf-audit)とポリシーができてから起動する
      seaweedfs-init:
        condition: service_healthy
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_service
      ORDER_APP_DB_PASSWORD: ${ORDER_APP_DB_PASSWORD:?make env を実行してください}
      # 書き込むイベント(Outbox)のスキーマ ID を起動時に解決する Schema Registry(ADR-0025 §3)
      ORDER_SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      # 注文 Saga(ADR-0029)。参加者の返信を読む(Consumer Group order.saga)。参加者は saga の profile で起動する
      # (order だけなら返信が来ないので、期限の後に補償を送り直し続け、OrderSagaCompensationStalled になる)。
      # 期限はローカルで確かめやすいよう既定どおり 30 秒、補償の送り直しの間隔 30 秒、期限切れの確認の間隔 5 秒
      ORDER_KAFKA_BOOTSTRAP: kafka:9092
      ORDER_SAGA_STEP_TIMEOUT: 30s
      ORDER_SAGA_COMPENSATION_INTERVAL: 30s
      ORDER_SAGA_TIMEOUT_SCAN_INTERVAL: 5s
      # 監査のアンカーの保存(ADR-0017 §5)。order の書込み用の identity(eiaf-audit-order)で、anchors/order/ の下にだけ書ける。
      # 間隔は、ローカルで確かめやすいよう 1 分(既定は 1 時間)。保持期間は make audit-verify の既定の最小値(P1D)と同じ
      ORDER_AUDIT_S3_ENDPOINT: http://seaweedfs:8333
      ORDER_AUDIT_S3_ACCESS_KEY: ${ORDER_AUDIT_S3_ACCESS_KEY:?make env を実行してください}
      ORDER_AUDIT_S3_SECRET_KEY: ${ORDER_AUDIT_S3_SECRET_KEY:?}
      ORDER_AUDIT_ANCHOR_INTERVAL: 1m
      ORDER_AUDIT_ANCHOR_RETENTION: P1D
      # iss はトークンに入っている値(ホストから見た URL)、JWKS はコンテナから届く URL(ADR-0019)
      OIDC_ISSUER: http://localhost:19180/realms/eiaf
      OIDC_JWKS_URI: http://keycloak:8080/realms/eiaf/protocol/openid-connect/certs
      ORDER_TLS_CERT_FILE: /certs/order-service.crt
      ORDER_TLS_KEY_FILE: /certs/order-service.key
      ORDER_TLS_CLIENT_CA_FILE: /certs/ca.crt
      ORDER_TLS_ALLOWED_CLIENTS: apisix
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - 127.0.0.1:19443:8443
    volumes:
      # CA の鍵(ca.key)は渡さない
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/order-service.crt:/certs/order-service.crt:ro
      - ./certs/order-service.key:/certs/order-service.key:ro
      - *probe-volume
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]

  # ---------------------------------------------------------------- core: data / security / gateway
  postgres:
    image: ${POSTGRES_IMAGE:?}
    profiles: [core]
    # PID 1 を init(tini)にする。負荷でヘルスチェックがタイムアウトすると、Docker はシェルだけを止め、残った psql は PID 1 の子になる。
    # PID 1 が postmaster だと、その psql が SIGPIPE で終わったのを「バックエンドの異常終了」とみなし、DB 全体をクラッシュリカバリする
    # (P07 ⑤ の make verify PROFILE="order saga" で発生)。init が孤児を引き取るので、postmaster は自分の子だけを見る
    init: true
    command:
      - postgres
      # Debezium(cdc profile)の論理レプリケーション(Framework 8)
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # コネクタが止まっても、レプリケーションスロットが保持する WAL がディスクを使い切らないようにする上限(P06 ③b)。
      # 超えるとスロットは無効(wal_status=lost)になり、その間のイベントは戻らない(回復の手順は docs/runbooks/cdc-outbox-lag.md。④)
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - shared_buffers=128MB
      # 接続数の上限(既定は 100)。core + order + cdc + saga + batch + file + saas を同時に動かす E2E で、サービスの接続のプール・
      # Debezium のコネクタ・運用者のコマンドの同時の実行の合計が 100 を超え、接続を断られた(P10 ⑦)
      - -c
      - max_connections=200
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?make env を実行してください}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?}
      LEGACY_SIM_DB_PASSWORD: ${LEGACY_SIM_DB_PASSWORD:?}
      BATCH_ETL_DB_PASSWORD: ${BATCH_ETL_DB_PASSWORD:?}
      FILE_EXCHANGE_DB_PASSWORD: ${FILE_EXCHANGE_DB_PASSWORD:?make env を実行してください}
      # アプリ用のロール({name}_app。ADR-0017)。追加前のボリュームには作られないため make clean が必要(infra/local/README.md)
      ORDER_APP_DB_PASSWORD: ${ORDER_APP_DB_PASSWORD:?make env を実行してください}
      INVENTORY_APP_DB_PASSWORD: ${INVENTORY_APP_DB_PASSWORD:?}
      PAYMENT_APP_DB_PASSWORD: ${PAYMENT_APP_DB_PASSWORD:?}
      SHIPPING_APP_DB_PASSWORD: ${SHIPPING_APP_DB_PASSWORD:?}
      LEGACY_SIM_APP_DB_PASSWORD: ${LEGACY_SIM_APP_DB_PASSWORD:?}
      BATCH_ETL_APP_DB_PASSWORD: ${BATCH_ETL_APP_DB_PASSWORD:?}
      # file-exchange の DB(P09 ⑥)。追加前のボリュームには作られないため make clean が必要(infra/local/README.md)
      FILE_EXCHANGE_APP_DB_PASSWORD: ${FILE_EXCHANGE_APP_DB_PASSWORD:?make env を実行してください}
      # SaaS 連携の DB(P10 ⑥)。追加前のボリュームには作られないため make clean が必要(infra/local/README.md)
      WEBHOOK_RECEIVER_DB_PASSWORD: ${WEBHOOK_RECEIVER_DB_PASSWORD:?make env を実行してください}
      WEBHOOK_RECEIVER_APP_DB_PASSWORD: ${WEBHOOK_RECEIVER_APP_DB_PASSWORD:?make env を実行してください}
      INTEGRATION_FLOW_DB_PASSWORD: ${INTEGRATION_FLOW_DB_PASSWORD:?make env を実行してください}
      INTEGRATION_FLOW_APP_DB_PASSWORD: ${INTEGRATION_FLOW_APP_DB_PASSWORD:?make env を実行してください}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      APICURIO_DB_PASSWORD: ${APICURIO_DB_PASSWORD:?}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?make env を実行してください}
      # postgres-exporter のユーザー(pg_monitor だけ。P06 ④)。追加前のボリュームには作られないため make clean が必要(infra/local/README.md)
      POSTGRES_EXPORTER_DB_PASSWORD: ${POSTGRES_EXPORTER_DB_PASSWORD:?make env を実行してください}
      LEGACY_RECONCILE_DB_PASSWORD: ${LEGACY_RECONCILE_DB_PASSWORD:?make env を実行してください}
      LEGACY_RESYNC_DB_PASSWORD: ${LEGACY_RESYNC_DB_PASSWORD:?make env を実行してください}
    ports:
      - 127.0.0.1:19432:5432
    volumes:
      # PostgreSQL 18 以降のイメージはメジャー版ごとのサブディレクトリ(/var/lib/postgresql/18/docker)を使う
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # 接続数の上限を 200 にした分(P10 ⑦)
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      # 初期化中の一時サーバは Unix ソケットだけで待ち受けるため、TCP で接続し、
      # 初期化スクリプト(postgres/init/)が最後に作る DB(apicurio)とロール(debezium)があることまで確かめる
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgres -d postgres &&
          [ "$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U postgres -d apicurio -tAc
          "select count(*) from pg_roles where rolname = 'debezium'")" = 1 ]

  keycloak:
    image: ${KEYCLOAK_IMAGE:?}
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # iss をホストから見た URL に固定し、コンテナ内からのバックチャネル(JWKS 等)は keycloak:8080 で受ける
      KC_HOSTNAME: http://localhost:19180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: warn
      # realm-eiaf.json の ${EIAF_E2E_CLIENT_SECRET} / ${EIAF_E2E_B_CLIENT_SECRET} / ${EIAF_BATCH_ETL_CLIENT_SECRET} を置換する
      EIAF_E2E_CLIENT_SECRET: ${EIAF_E2E_CLIENT_SECRET:?}
      EIAF_E2E_B_CLIENT_SECRET: ${EIAF_E2E_B_CLIENT_SECRET:?make env を実行してください}
      EIAF_BATCH_ETL_CLIENT_SECRET: ${EIAF_BATCH_ETL_CLIENT_SECRET:?make env を実行してください}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
    ports:
      - 127.0.0.1:19180:8080
    volumes:
      - ./keycloak/realm-eiaf.json:/opt/keycloak/data/import/realm-eiaf.json:ro
    mem_limit: 896m
    healthcheck:
      <<: *healthcheck
      # イメージに curl / wget が無いため bash の /dev/tcp で管理ポートの /health/ready を叩く
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      # start-dev は起動のたびにビルドし直すため、CPU が混んでいると 2 分以上かかることがある
      start_period: 120s

  # API Gateway(ADR-0023)。order-service へは mTLS(クライアント証明書 apisix。ADR-0024 §6)
  # - 鍵(certs/apisix.key。0600)を読むため、ホストの利用者の uid で動かす。グループは 0(root の利用者ではない):
  #   APISIX のイメージは conf/ と logs/ をグループ root に書き込み可にしていて、任意の uid で動かす場合はグループ 0 が要る
  # - 証明書と鍵は起動時にファイルから読み、APISIX のプロセスの環境変数にだけ渡す(apisix.yaml の ${{GATEWAY_CLIENT_*}})。
  #   compose の environment には書かない(docker inspect に出ない)。YAML の文字列に入れるため、改行を \n にする
  apisix:
    image: ${APISIX_IMAGE:?}
    profiles: [core]
    user: "${EIAF_UID:-65532}:0"
    entrypoint:
      - sh
      - -c
      - >-
        pem() { awk '{printf "%s\\n", $$0}' "$$1"; } &&
        export GATEWAY_CLIENT_CERT="$$(pem /certs/apisix.crt)" GATEWAY_CLIENT_KEY="$$(pem /certs/apisix.key)" &&
        exec /docker-entrypoint.sh docker-start
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - 127.0.0.1:19080:9080
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      # CA の鍵(ca.key)は渡さない
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/apisix.crt:/certs/apisix.crt:ro
      - ./certs/apisix.key:/certs/apisix.key:ro
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/7085 &&
          printf 'GET /status/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]

  # ---------------------------------------------------------------- core: observability
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:?}
    profiles: [core]
    command: ["--config=/etc/otelcol/collector.yaml"]
    ports:
      - 127.0.0.1:19317:4317
      - 127.0.0.1:19318:4318
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - *probe-volume
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      # health_check 拡張(:13133)をコンテナ内から確認する
      test: ["CMD", "/probe/bin/wget", "-q", "--spider", "http://127.0.0.1:13133/"]

  prometheus:
    image: ${PROMETHEUS_IMAGE:?}
    profiles: [core]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - 127.0.0.1:19090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # アラートのルール(P06 ④。単体テストは make alerts-test)
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]

  tempo:
    image: ${TEMPO_IMAGE:?}
    profiles: [core]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - 127.0.0.1:19320:3200
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # すべての profile を同時に動かす E2E で、使用量が上限の 96% になった(P10 ⑦。saas のサービスの span が増えた)
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      # tempo 自身の -health(/ready を確認して終了する)
      test: ["CMD", "/tempo", "-health"]
      start_period: 30s

  loki:
    image: ${LOKI_IMAGE:?}
    profiles: [core]
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - 127.0.0.1:19310:3100
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
      - *probe-volume
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      start_period: 30s

  grafana:
    image: ${GRAFANA_IMAGE:?}
    profiles: [core]
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
      # Go のランタイムに上限を知らせ、mem_limit に達する前に GC させる
      GOMEMLIMIT: 384MiB
    ports:
      - 127.0.0.1:19300:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]

volumes:
  kafka-data:
  mosquitto-data:
  seaweedfs-data:
  sftp-data:
  sftp-b2b-data:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:

networks:
  default:
    name: eiaf
