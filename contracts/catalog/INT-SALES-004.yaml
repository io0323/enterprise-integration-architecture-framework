id: INT-SALES-004
name: Daily Sales File
description: >-
  日次の売上ファイル(Parquet / CSV + gzip と .manifest.json)。batch-etl が S3 互換ストレージに置き、file-exchange が検査して受け取り、
  取引先に SFTP で送る(PGP で暗号化と署名。P09)
style: file
pattern: file-transfer
provider: { owner: team-analytics, system: batch-etl }
consumers:
  - { owner: team-integration, system: file-exchange }
contract: contracts/files/sales_daily.v1.yaml
tier: 2
dataClassification: internal
# 前日の分を翌朝(日次の SLA の 06:00 JST の後)に出す。latencyP99 は業務の日の終わりから受け手が受け取るまで
slo: { availability: "99.9", latencyP99: "8h" }
lifecycle: active
