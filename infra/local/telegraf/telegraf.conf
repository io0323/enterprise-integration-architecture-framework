# Mosquitto の $SYS を Prometheus に出す(iot profile。ADR-0039 §9)。iot-bridge が止まっている間こそ要るので、iot-bridge とは別に動かす。
# - 監視のユーザー eiaf-monitor($SYS の読み取りだけ。ACL は mosquitto/start.sh)で購読する。QoS 0(溜め込まない)
# - Prometheus の名前は {name_override}_{value_field_name}。例 mosquitto_store_messages_count
# - Mosquitto が止まって $SYS が届かなくなったら、expiration_interval の後に系列が消える(古い値で判断しない)
[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# 保存のメッセージの数(送り中・溜め込み。retain は使わない設定なので、iot-bridge のセッションの溜め込みとして読める)
[[inputs.mqtt_consumer]]
  name_override = "mosquitto_store_messages"
  servers = ["tcp://mosquitto:1883"]
  topics = ["$SYS/broker/store/messages/count"]
  topic_tag = ""
  qos = 0
  username = "eiaf-monitor"
  password = "${MQTT_MONITOR_PASSWORD}"
  data_format = "value"
  startup_error_behavior = "retry"
  data_type = "integer"
  value_field_name = "count"

# 保存のメッセージのバイト数(max_queued_bytes に近づいていないか)
[[inputs.mqtt_consumer]]
  name_override = "mosquitto_store_messages"
  servers = ["tcp://mosquitto:1883"]
  topics = ["$SYS/broker/store/messages/bytes"]
  topic_tag = ""
  qos = 0
  username = "eiaf-monitor"
  password = "${MQTT_MONITOR_PASSWORD}"
  data_format = "value"
  startup_error_behavior = "retry"
  data_type = "integer"
  value_field_name = "bytes"

# 送り中・溜め込みの上限を超えて捨てた数(Broker の起動からの累計)。増えたら、そのデータは失われている
[[inputs.mqtt_consumer]]
  name_override = "mosquitto_publish_messages"
  servers = ["tcp://mosquitto:1883"]
  topics = ["$SYS/broker/publish/messages/dropped"]
  topic_tag = ""
  qos = 0
  username = "eiaf-monitor"
  password = "${MQTT_MONITOR_PASSWORD}"
  data_format = "value"
  startup_error_behavior = "retry"
  data_type = "integer"
  value_field_name = "dropped"

# 接続しているクライアントの数
[[inputs.mqtt_consumer]]
  name_override = "mosquitto_clients"
  servers = ["tcp://mosquitto:1883"]
  topics = ["$SYS/broker/clients/connected"]
  topic_tag = ""
  qos = 0
  username = "eiaf-monitor"
  password = "${MQTT_MONITOR_PASSWORD}"
  data_format = "value"
  startup_error_behavior = "retry"
  data_type = "integer"
  value_field_name = "connected"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # $SYS は 10 秒ごとに届く(sys_interval の既定)。届かなくなったら 1 分で系列を消す
  expiration_interval = "60s"
  export_timestamp = false
