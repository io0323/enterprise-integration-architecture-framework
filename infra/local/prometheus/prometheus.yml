# Prometheus(Framework 14)。アプリのメトリクスは OTLP(Collector → /api/v1/otlp)で受ける。
# ここではミドルウェア自身のメトリクスだけを scrape する。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# アラートのルール(P06 ④。単体テストの *.test.yml は読まない)。Alertmanager は置かず、firing は Prometheus の /alerts と Grafana で見る
rule_files:
  - /etc/prometheus/rules/*.rules.yml

otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - deployment.environment

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]
  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: apicurio
    static_configs:
      - targets: ["apicurio:9000"]
  # CDC(P06 ④。cdc / order profile)。core だけで起動したときは target が down になる(アラートはその場合を除いて判定する)
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: kafka-connect
    static_configs:
      - targets: ["kafka-connect:9404"]
