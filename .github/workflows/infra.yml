name: infra
on:
  pull_request:
    paths:
      - "infra/local/**"
      - "services/*/app/Dockerfile"
      - "services/*/app/.dockerignore"
      - "tools/schema-publish/Dockerfile"
      - "tools/schema-publish/.dockerignore"
      - "Makefile"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/local/**"
      - "services/*/app/Dockerfile"
      - "services/*/app/.dockerignore"
      - "tools/schema-publish/Dockerfile"
      - "tools/schema-publish/.dockerignore"
      - "Makefile"
      - ".github/workflows/infra.yml"
permissions:
  contents: read
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

# ADR-0016: ローカル基盤(infra/local)を profile ごとに起動し、`make verify` で healthy と機能の疎通を検査する。
# 1 ジョブ 1 profile(core + その profile)とし、ランナーのメモリ(private リポジトリの ubuntu-latest は 7GB 程度)に収める。
# アクションは ci.yml と同じくコミット SHA で固定する。
jobs:
  compose-config:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate .env
        run: make env
      - name: Validate every profile
        run: |
          for profile in core cdc iot file b2b chaos order; do
            echo "::group::$profile"
            docker compose -f infra/local/docker-compose.yml --env-file infra/local/images.env --env-file infra/local/.env \
              --profile core --profile "$profile" config --quiet
            echo "::endgroup::"
          done
      - name: Every image is pinned by tag and digest
        run: |
          bad="$(grep -E '^[A-Z0-9_]+_IMAGE=' infra/local/images.env | grep -v -E '^[A-Z0-9_]+_IMAGE=[^@[:space:]]+:[^@[:space:]]+@sha256:[0-9a-f]{64}$' || true)"
          if [ -n "$bad" ]; then echo "タグ + ダイジェストで固定されていないイメージがあります:"; echo "$bad"; exit 1; fi
          if grep -n -E '^\s+image:' infra/local/docker-compose.yml | grep -v -E 'image: \$\{[A-Z0-9_]+_IMAGE:\?[^}]*\}$'; then
            echo "docker-compose.yml の image は images.env の変数で指定してください"; exit 1
          fi
      # 自前で組み立てるイメージ(ADR-0016 §9)も、ベースは images.env の変数だけにし、取得する成果物は SHA-256 で固定する
      - name: Self-built images use images.env bases and checksummed downloads
        run: |
          status=0
          for dockerfile in infra/local/images/*/Dockerfile services/*/app/Dockerfile; do
            if grep -n -E '^FROM ' "$dockerfile" | grep -v -E 'FROM \$\{[A-Z0-9_]+_IMAGE\}( AS [a-z0-9-]+)?$'; then
              echo "$dockerfile: FROM は images.env の変数(ARG で受け取る \${..._IMAGE})だけにしてください"; status=1
            fi
            # 行末の \ で続く行を 1 行にしてから見る(URL は ADD の次の行に書くことが多い)
            if sed -e ':a' -e '/\\$/N; s/\\\n//; ta' "$dockerfile" | grep -E '^ADD ' | grep -E 'https?://' | grep -v -E -- '--checksum=sha256:'; then
              echo "$dockerfile: URL から取得する ADD には --checksum=sha256:... を付けてください"; status=1
            fi
          done
          exit $status

  verify:
    name: verify (${{ matrix.profile }})
    needs: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [core, cdc, iot, file, b2b, chaos, order]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker versions
        run: docker version --format 'engine {{.Server.Version}}' && docker compose version
      # ランナーのディスクは cdc などのイメージを取得すると 90% を超え、Loki が WAL の書き込みを止める
      # (disk usage exceeded threshold)。使わない SDK を削除して空きを作る。
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force >/dev/null
          df -h /
      # order profile: イメージの中身(installDist)を Gradle で作る(make up が order-dist を実行する)
      - if: ${{ matrix.profile == 'order' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - if: ${{ matrix.profile == 'order' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Up
        run: make up PROFILE=${{ matrix.profile }}
      - name: Verify
        run: |
          set -o pipefail
          make verify PROFILE=${{ matrix.profile }} | tee verify.txt
      - name: Memory
        if: ${{ !cancelled() }}
        run: make stats | tee stats.md && df -h /
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## infra verify: ${{ matrix.profile }}"
            echo
            if [ -f verify.txt ]; then echo '```'; grep -E '^(FAIL|profile=)' verify.txt || true; echo '```'; fi
            if [ -f stats.md ]; then cat stats.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: ${{ failure() }}
        run: make ps && docker compose -f infra/local/docker-compose.yml --env-file infra/local/images.env --env-file infra/local/.env --profile '*' logs --tail=200
      - name: Down
        if: ${{ always() }}
        run: make clean
