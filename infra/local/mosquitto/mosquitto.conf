# Mosquitto(iot profile。Framework 17.3)。匿名接続を拒否する(Framework 12.3: 境界内でも認証必須)。
# パスワードファイルは起動時に .env の MQTT_USERNAME / MQTT_PASSWORD から生成する(docker-compose.yml)。
# トピック単位の ACL と Kafka へのブリッジは P11(iot-bridge)で追加する。
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
