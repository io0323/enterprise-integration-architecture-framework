# b2b.rules.yml の単体テスト(promtool test rules。make alerts-test)。
# promtool の time() は評価の時刻(UNIX 秒。テストの開始が 0)なので、期限(UNIX 秒)は「開始からの秒数」で書く。
rule_files:
  - b2b.rules.yml

evaluation_interval: 1m

tests:
  - name: 期限まで 1 時間を切ったら警告、過ぎたら重大。余裕があれば出さない
    interval: 1m
    input_series:
      # p1: 4 時間後、p2: 40 分後、p3: 開始から 10 分後(評価の時点で過ぎている)
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p1"}'
        values: "14400x30"
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p2"}'
        values: "2400x30"
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p3"}'
        values: "600x30"
    alert_rule_test:
      - eval_time: 3m
        alertname: B2bAperakDeadlineApproaching
        exp_alerts: []
      - eval_time: 20m
        alertname: B2bAperakDeadlineApproaching
        exp_alerts:
          - exp_labels: { severity: warning, trading_partner_id: p2 }
            exp_annotations:
              summary: "取引先 p2 の業務の応答(APERAK)の期限まで 1 時間を切った注文が、社内への取り込みを待っている"
              runbook: docs/runbooks/b2b-partner-credentials.md#社内への取り込み
      - eval_time: 20m
        alertname: B2bAperakDeadlinePassed
        exp_alerts:
          - exp_labels: { severity: critical, trading_partner_id: p3 }
            exp_annotations:
              summary: "取引先 p3 の業務の応答(APERAK)の期限を過ぎた注文が、社内への取り込みを待っている"
              runbook: docs/runbooks/b2b-partner-credentials.md#社内への取り込み

  - name: 送信待ちがなくなれば(系列が消えれば)、期限のアラートは消える
    interval: 1m
    input_series:
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p1"}'
        values: "600x20 _x10"
    alert_rule_test:
      - eval_time: 18m
        alertname: B2bAperakDeadlinePassed
        exp_alerts:
          - exp_labels: { severity: critical, trading_partner_id: p1 }
            exp_annotations:
              summary: "取引先 p1 の業務の応答(APERAK)の期限を過ぎた注文が、社内への取り込みを待っている"
              runbook: docs/runbooks/b2b-partner-credentials.md#社内への取り込み
      - eval_time: 30m
        alertname: B2bAperakDeadlinePassed
        exp_alerts: []

  - name: 送り直しの上限を過ぎた注文があれば、すぐに重大。なければ出さない
    interval: 1m
    input_series:
      - series: 'eia_b2b_order_submission_expired{job="b2b-gateway",trading_partner_id="p1"}'
        values: "0x5 1x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: B2bOrderSubmissionExpired
        exp_alerts: []
      - eval_time: 8m
        alertname: B2bOrderSubmissionExpired
        exp_alerts:
          - exp_labels: { severity: critical, trading_partner_id: p1 }
            exp_annotations:
              summary: "取引先 p1 の注文が、送り直しの上限を過ぎて社内に取り込めなかった(手の対応が要る)"
              runbook: docs/runbooks/b2b-partner-credentials.md#送り直しの上限を過ぎた注文

  - name: 拒否した文書は、取引先と段階ごとにすぐ警告する。拒否のない文書では出さない
    interval: 1m
    input_series:
      # 起動時に 0 で作った系列(p1 の schema は拒否なし)
      - series: 'eia_b2b_documents_rejected_total{job="b2b-gateway",trading_partner_id="p1",b2b_stage="schema"}'
        values: "0x20"
      - series: 'eia_b2b_documents_rejected_total{job="b2b-gateway",trading_partner_id="p1",b2b_stage="business"}'
        values: "0x5 1x15"
      - series: 'eia_b2b_documents_rejected_total{job="b2b-gateway",trading_partner_id="p2",b2b_stage="decryption"}'
        values: "0x5 1x15"
    alert_rule_test:
      - eval_time: 3m
        alertname: B2bDocumentRejected
        exp_alerts: []
      - eval_time: 8m
        alertname: B2bDocumentRejected
        exp_alerts:
          - exp_labels: { severity: warning, trading_partner_id: p1, b2b_stage: business }
            exp_annotations:
              summary: "取引先 p1 の文書を business の段階で拒否した"
              runbook: docs/runbooks/b2b-partner-credentials.md#拒否した文書
          - exp_labels: { severity: warning, trading_partner_id: p2, b2b_stage: decryption }
            exp_annotations:
              summary: "取引先 p2 の文書を decryption の段階で拒否した"
              runbook: docs/runbooks/b2b-partner-credentials.md#拒否した文書

  - name: 処理中に残るファイル・受け取りのディレクトリを見られない・応答を送れない・取り込めない状態は、15 分続いたら警告する
    interval: 1m
    input_series:
      - series: 'eia_b2b_inbox_stuck{job="b2b-gateway",trading_partner_id="p1"}'
        values: "1x30"
      - series: 'eia_b2b_inbox_failures_total{job="b2b-gateway",trading_partner_id="p1",b2b_reason="list"}'
        values: "0+1x30"
      - series: 'eia_b2b_acknowledgements_total{job="b2b-gateway",trading_partner_id="p1",b2b_outcome="failed"}'
        values: "0+1x30"
      - series: 'eia_b2b_order_submissions_total{job="b2b-gateway",b2b_outcome="failed"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: B2bInboxStuck
        exp_alerts: []
      - eval_time: 25m
        alertname: B2bInboxStuck
        exp_alerts:
          - exp_labels: { severity: warning, trading_partner_id: p1 }
            exp_annotations:
              summary: "取引先 p1 のファイルが、受け付けに失敗して処理中のディレクトリに残っている"
              runbook: docs/runbooks/b2b-partner-credentials.md#受け取りのディレクトリ
      - eval_time: 25m
        alertname: B2bInboxUnavailable
        exp_alerts:
          - exp_labels: { severity: warning, trading_partner_id: p1 }
            exp_annotations:
              summary: "取引先 p1 の受け取りのディレクトリを見られない(取引先の SFTP・鍵・ホスト鍵)"
              runbook: docs/runbooks/b2b-partner-credentials.md#期限が切れたとき
      - eval_time: 25m
        alertname: B2bAcknowledgementSendFailing
        exp_alerts:
          - exp_labels: { severity: warning, trading_partner_id: p1 }
            exp_annotations:
              summary: "取引先 p1 に応答(CONTRL・APERAK)を送れない状態が続いている"
              runbook: docs/runbooks/b2b-partner-credentials.md#応答の送信
      - eval_time: 25m
        alertname: B2bOrderSubmissionFailing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "受け付けた注文を、order の API に取り込めない状態が続いている"
              runbook: docs/runbooks/b2b-partner-credentials.md#社内への取り込み

  - name: 1 回だけの失敗(次の回に回復)では、続いている状態の警告は出さない
    interval: 1m
    input_series:
      - series: 'eia_b2b_acknowledgements_total{job="b2b-gateway",trading_partner_id="p1",b2b_outcome="failed"}'
        values: "0x5 1x25"
    alert_rule_test:
      - eval_time: 25m
        alertname: B2bAcknowledgementSendFailing
        exp_alerts: []
