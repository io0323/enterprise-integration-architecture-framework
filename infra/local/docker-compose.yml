# EIAF ローカル基盤(ADR-0003 / ADR-0015 / ADR-0016)
# - 起動は Makefile 経由: `make up PROFILE=<core|cdc|iot|file|b2b|chaos>`(core は常に含まれる)
# - イメージは images.env(タグ + ダイジェスト)、秘密情報は .env(`make env` で生成)から読む。
# - ホスト側のポートは 127.0.0.1 の 19000〜19999 に割り当てる。一覧は README.md。
name: eiaf

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

# シェルのないイメージのヘルスチェック用に、busybox(静的リンク)を /probe に読み取り専用でマウントする(ADR-0016 §4)
x-probe-volume: &probe-volume
  type: image
  source: ${PROBE_IMAGE:?images.env を --env-file で指定してください}
  target: /probe

services:
  # ---------------------------------------------------------------- core: messaging
  kafka:
    image: ${KAFKA_IMAGE:?}
    profiles: [core]
    hostname: kafka
    environment:
      CLUSTER_ID: eiaf-local-kraft-cluster1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # PLAINTEXT: コンテナ間 / EXTERNAL: ホスト(アプリ・テスト)
      # TOXI_HOST / TOXI_INTERNAL: Toxiproxy 経由の専用リスナー(chaos profile)。advertised を Toxiproxy のアドレスにし、
      # メタデータ取得後の接続も Toxiproxy を通るようにする(ホスト: localhost:19094 / コンテナ: toxiproxy:19095)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092,TOXI_HOST://:9094,TOXI_INTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092,TOXI_HOST://localhost:19094,TOXI_INTERNAL://toxiproxy:19095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,TOXI_HOST:PLAINTEXT,TOXI_INTERNAL:PLAINTEXT
      # 単一ブローカー
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 命名規約外のトピックを作らせない(Framework 6.2)。トピックは各フェーズの初期化で明示的に作る
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports:
      - 127.0.0.1:19092:19092
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      <<: *healthcheck
      # CLI の JVM がブローカーの KAFKA_HEAP_OPTS を引き継がないよう、ヒープを小さく上書きする
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s

  apicurio:
    image: ${APICURIO_REGISTRY_IMAGE:?}
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: apicurio
      APICURIO_DATASOURCE_PASSWORD: ${APICURIO_DB_PASSWORD:?make env を実行してください}
      # 既定のグローバル互換性ルール(ADR-0014: 登録時は全版と FULL 互換)
      APICURIO_RULES_GLOBAL_COMPATIBILITY: FULL_TRANSITIVE
      APICURIO_RULES_GLOBAL_VALIDITY: FULL
      APICURIO_REST_DELETION_ARTIFACT_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:19081
      JAVA_OPTS_APPEND: -XX:MaxRAMPercentage=60
    ports:
      - 127.0.0.1:19081:8080
    mem_limit: 640m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]

  # ---------------------------------------------------------------- cdc
  kafka-connect:
    # Debezium の公式イメージは使わず、images.env の apache/kafka に Maven Central の Debezium の Postgres コネクタと
    # Apicurio の Converter を載せて組み立てる(ADR-0016 §9。版と SHA-256 は Dockerfile で固定)
    build:
      context: ./images/kafka-connect
      args:
        KAFKA_IMAGE: ${KAFKA_IMAGE:?}
    profiles: [cdc]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      apicurio:
        condition: service_healthy
    environment:
      # CONNECT_<NAME> は connect-distributed.properties の <name>(大文字 → 小文字、_ → .)。images/kafka-connect/connect-entrypoint.sh
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      # Connect の内部トピックと Consumer Group(業務トピックの命名規約の対象外。先頭の _ で区別する)
      CONNECT_GROUP_ID: debezium.connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect.configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect.offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # auto.create.topics.enable=false のため、コネクタの出力先トピックは Connect が明示的に作る(topic.creation.*)
      CONNECT_TOPIC_CREATION_ENABLE: "true"
      # Apicurio の Avro Converter はイメージに含めている(plugin.path の apicurio-converter。P06 の Outbox で使う)
      # コネクタの設定に秘密情報を平文で書かず、${env:VAR} で参照させる(Framework 12.2。ADR-0016 §7)。
      # 平文で書くと _connect.configs トピックと REST(GET /connectors/{name}/config)から読めてしまう
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - 127.0.0.1:19083:8083
    mem_limit: 1g
    healthcheck:
      <<: *healthcheck
      # apache/kafka には curl がないため、BusyBox の wget を使う
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/connector-plugins"]
      # 起動時のグループ参加(NotCoordinator の再試行)で REST の待ち受けまで 1 分以上かかることがある
      start_period: 90s

  # ---------------------------------------------------------------- iot
  mosquitto:
    image: ${MOSQUITTO_IMAGE:?}
    profiles: [iot]
    # パスワードファイルを .env の値から起動のたびに作り直す(ボリュームには置かない。mosquitto ユーザーの所有・0700 が必要)
    entrypoint:
      - sh
      - -c
      - >-
        rm -f /mosquitto/passwd &&
        mosquitto_passwd -b -c /mosquitto/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/passwd && chmod 0700 /mosquitto/passwd &&
        exec /docker-entrypoint.sh mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?make env を実行してください}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?}
    ports:
      - 127.0.0.1:19883:1883
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t '$$SYS/broker/uptime' -C 1 -W 5 >/dev/null

  # ---------------------------------------------------------------- file / b2b
  # S3 互換オブジェクトストレージ(ADR-0015)。master・volume・filer・S3 ゲートウェイを 1 プロセスで動かす
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?}
    profiles: [file, b2b]
    # S3 の認証情報(.env)から設定ファイルを生成してから起動する。
    # - eiaf: 管理者(バケットとポリシーの作成用)
    # - eiaf-audit: 監査のアンカー専用。操作はバケット eiaf-audit に限る。Write に含まれる管理操作(Object Lock の設定の変更など)は、
    #   seaweedfs-init が設定するバケットポリシーで拒否する(ADR-0017)
    # - eiaf-audit-verify: 監査の検査(make audit-verify)専用。バケット eiaf-audit の Read / List だけ
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /etc/seaweedfs &&
        printf '{"identities":[{"name":"eiaf","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"eiaf-audit","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:eiaf-audit","Write:eiaf-audit","List:eiaf-audit"]},{"name":"eiaf-audit-verify","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:eiaf-audit","List:eiaf-audit"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$AUDIT_S3_ACCESS_KEY" "$$AUDIT_S3_SECRET_KEY"
        "$$AUDIT_VERIFY_S3_ACCESS_KEY" "$$AUDIT_VERIFY_S3_SECRET_KEY" > /etc/seaweedfs/s3.json &&
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
        -master.volumeSizeLimitMB=256 -volume.max=32
        -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?make env を実行してください}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      AUDIT_S3_ACCESS_KEY: ${AUDIT_S3_ACCESS_KEY:?make env を実行してください}
      AUDIT_S3_SECRET_KEY: ${AUDIT_S3_SECRET_KEY:?}
      AUDIT_VERIFY_S3_ACCESS_KEY: ${AUDIT_VERIFY_S3_ACCESS_KEY:?make env を実行してください}
      AUDIT_VERIFY_S3_SECRET_KEY: ${AUDIT_VERIFY_S3_SECRET_KEY:?}
    ports:
      - 127.0.0.1:19333:8333
    volumes:
      - seaweedfs-data:/data
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]

  # 監査のアンカー用のバケット(eiaf-audit。Object Lock)とバケットポリシーを作る(ADR-0017)。make up のたびに実行し、終えたら待機する。
  # 完了はヘルスチェック(完了のファイル)で示す。終了させると、Compose v2.38 の up --wait が失敗として扱うため
  seaweedfs-init:
    image: ${AWS_CLI_IMAGE:?}
    profiles: [file, b2b]
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["bash", "/init/init-audit-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?make env を実行してください}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ./seaweedfs/init-audit-bucket.sh:/init/init-audit-bucket.sh:ro
      - ./seaweedfs/audit-bucket-policy.json:/init/audit-bucket-policy.json:ro
    mem_limit: 256m
    restart: "no"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "test", "-f", "/tmp/initialized"]

  # SFTP(file profile。社内システムとのファイル授受)。公開鍵認証のみ
  sftp:
    image: ${SFTP_IMAGE:?}
    profiles: [file]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      USER_NAME: eiaf-file
      PUBLIC_KEY_FILE: /keys/sftp-file.pub
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    ports:
      - 127.0.0.1:19222:2222
    volumes:
      - ./secrets/sftp-file.pub:/keys/sftp-file.pub:ro
      - ./sftp/10-directories.sh:/custom-cont-init.d/10-directories.sh:ro
      - sftp-data:/config
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]

  # SFTP(b2b profile。取引先向け。ADR-0008 で B2B のプロトコルは SFTP のみ)。社内向けの sftp とは利用者・鍵・保存領域を分ける
  sftp-b2b:
    image: ${SFTP_IMAGE:?}
    profiles: [b2b]
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      USER_NAME: partner01
      PUBLIC_KEY_FILE: /keys/sftp-b2b.pub
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
      LOG_STDOUT: "true"
    ports:
      - 127.0.0.1:19223:2222
    volumes:
      - ./secrets/sftp-b2b.pub:/keys/sftp-b2b.pub:ro
      - ./sftp/10-directories.sh:/custom-cont-init.d/10-directories.sh:ro
      - sftp-b2b-data:/config
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]

  # ---------------------------------------------------------------- chaos
  # 障害注入(Framework 13 / P04b・P14)。proxies は toxiproxy/toxiproxy.json、toxic は API(:19474)で入れる
  toxiproxy:
    image: ${TOXIPROXY_IMAGE:?}
    profiles: [chaos]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:19474:8474
      - 127.0.0.1:19094:19094
      - 127.0.0.1:19433:19433
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck
      # イメージ同梱の CLI で API(:8474)に問い合わせる
      test: ["CMD", "/toxiproxy-cli", "list"]

  # ---------------------------------------------------------------- core: data / security / gateway
  postgres:
    image: ${POSTGRES_IMAGE:?}
    profiles: [core]
    command:
      - postgres
      # Debezium(cdc profile)の論理レプリケーション(Framework 8)
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?make env を実行してください}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?}
      LEGACY_SIM_DB_PASSWORD: ${LEGACY_SIM_DB_PASSWORD:?}
      BATCH_ETL_DB_PASSWORD: ${BATCH_ETL_DB_PASSWORD:?}
      # アプリ用のロール({name}_app。ADR-0017)。追加前のボリュームには作られないため make clean が必要(infra/local/README.md)
      ORDER_APP_DB_PASSWORD: ${ORDER_APP_DB_PASSWORD:?make env を実行してください}
      INVENTORY_APP_DB_PASSWORD: ${INVENTORY_APP_DB_PASSWORD:?}
      PAYMENT_APP_DB_PASSWORD: ${PAYMENT_APP_DB_PASSWORD:?}
      SHIPPING_APP_DB_PASSWORD: ${SHIPPING_APP_DB_PASSWORD:?}
      LEGACY_SIM_APP_DB_PASSWORD: ${LEGACY_SIM_APP_DB_PASSWORD:?}
      BATCH_ETL_APP_DB_PASSWORD: ${BATCH_ETL_APP_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      APICURIO_DB_PASSWORD: ${APICURIO_DB_PASSWORD:?}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?make env を実行してください}
    ports:
      - 127.0.0.1:19432:5432
    volumes:
      # PostgreSQL 18 以降のイメージはメジャー版ごとのサブディレクトリ(/var/lib/postgresql/18/docker)を使う
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      # 初期化中の一時サーバは Unix ソケットだけで待ち受けるため、TCP で接続し、
      # 初期化スクリプト(postgres/init/)が最後に作る DB(apicurio)とロール(debezium)があることまで確かめる
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgres -d postgres &&
          [ "$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U postgres -d apicurio -tAc
          "select count(*) from pg_roles where rolname = 'debezium'")" = 1 ]

  keycloak:
    image: ${KEYCLOAK_IMAGE:?}
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # iss をホストから見た URL に固定し、コンテナ内からのバックチャネル(JWKS 等)は keycloak:8080 で受ける
      KC_HOSTNAME: http://localhost:19180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: warn
      # realm-eiaf.json の ${EIAF_E2E_CLIENT_SECRET} を置換する
      EIAF_E2E_CLIENT_SECRET: ${EIAF_E2E_CLIENT_SECRET:?}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
    ports:
      - 127.0.0.1:19180:8080
    volumes:
      - ./keycloak/realm-eiaf.json:/opt/keycloak/data/import/realm-eiaf.json:ro
    mem_limit: 896m
    healthcheck:
      <<: *healthcheck
      # イメージに curl / wget が無いため bash の /dev/tcp で管理ポートの /health/ready を叩く
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      # start-dev は起動のたびにビルドし直すため、CPU が混んでいると 2 分以上かかることがある
      start_period: 120s

  apisix:
    image: ${APISIX_IMAGE:?}
    profiles: [core]
    environment:
      APISIX_STAND_ALONE: "true"
    ports:
      - 127.0.0.1:19080:9080
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/7085 &&
          printf 'GET /status/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]

  # ---------------------------------------------------------------- core: observability
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:?}
    profiles: [core]
    command: ["--config=/etc/otelcol/collector.yaml"]
    ports:
      - 127.0.0.1:19317:4317
      - 127.0.0.1:19318:4318
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - *probe-volume
    mem_limit: 256m
    healthcheck:
      <<: *healthcheck
      # health_check 拡張(:13133)をコンテナ内から確認する
      test: ["CMD", "/probe/bin/wget", "-q", "--spider", "http://127.0.0.1:13133/"]

  prometheus:
    image: ${PROMETHEUS_IMAGE:?}
    profiles: [core]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - 127.0.0.1:19090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]

  tempo:
    image: ${TEMPO_IMAGE:?}
    profiles: [core]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - 127.0.0.1:19320:3200
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      # tempo 自身の -health(/ready を確認して終了する)
      test: ["CMD", "/tempo", "-health"]
      start_period: 30s

  loki:
    image: ${LOKI_IMAGE:?}
    profiles: [core]
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - 127.0.0.1:19310:3100
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
      - *probe-volume
    mem_limit: 384m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/probe/bin/wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      start_period: 30s

  grafana:
    image: ${GRAFANA_IMAGE:?}
    profiles: [core]
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
      # Go のランタイムに上限を知らせ、mem_limit に達する前に GC させる
      GOMEMLIMIT: 384MiB
    ports:
      - 127.0.0.1:19300:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]

volumes:
  kafka-data:
  mosquitto-data:
  seaweedfs-data:
  sftp-data:
  sftp-b2b-data:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:

networks:
  default:
    name: eiaf
