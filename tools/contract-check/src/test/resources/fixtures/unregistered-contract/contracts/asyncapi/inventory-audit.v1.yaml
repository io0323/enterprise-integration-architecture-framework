asyncapi: 3.0.0
info:
  title: Inventory Audit
  version: 1.0.0
  description: 在庫の棚卸しのイベント(カタログに登録していない契約の例)
channels:
  stockAudited:
    address: inventory.stock.audited.v1
    messages:
      stockAudited:
        $ref: "#/components/messages/StockAudited"
operations:
  publishStockAudited:
    action: send
    channel:
      $ref: "#/channels/stockAudited"
components:
  messages:
    StockAudited:
      name: StockAudited
      contentType: avro/binary
      headers:
        type: object
        required: [ce_id, ce_source, ce_type, ce_time, ce_specversion, traceparent, correlationid]
        properties:
          ce_id: { type: string }
          ce_source: { type: string }
          ce_type: { type: string }
          ce_time: { type: string }
          ce_specversion: { type: string }
          traceparent: { type: string }
          correlationid: { type: string }
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: "../avro/inventory/StockAudited.avsc"
