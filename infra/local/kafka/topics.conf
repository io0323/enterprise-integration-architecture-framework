# アプリが書くトピックの定義(auto.create.topics.enable=false のため、明示的に作る。ADR-0016・ADR-0026)。
# compose の kafka-topics(1 回だけ動くコンテナ。create-topics.sh)と、統合テスト(legacy-order-acl の app)が同じこのファイルを読む。
# Debezium が書くトピック(生の CDC・Outbox の発行先)はコネクタの topic.creation.* で作るので、原則ここには書かない。
# 例外: 注文 Saga のコマンドのトピックは、保持期間(7 日)が「取消済み」の印の保持期間の根拠なので(ADR-0029 §5)、ここで明示して作る
# (Debezium は既にあるトピックをそのまま使う)。
#
# 形式: トピック名 パーティション数 設定(key=value のカンマ区切り) 機密区分(カタログの dataClassification)
# - Kafka のトピックの設定には機密区分を書けないため、最後の列で持つ(読み取りの権限の制御は secure profile の #26)。
# - 既にあるトピックは、設定だけをこのファイルの値にそろえる(パーティション数は増やさない・減らせない)。
#
# INT-SALES-003(ADR-0026 §9): 注文のヘッダの最新の状態。compacted。tombstone は 1 日残す(契約の AsyncAPI の消費者の条件)
sales.legacy-order.changed.v1 3 cleanup.policy=compact,delete.retention.ms=86400000 confidential
# ADR-0026 §7: 変換できない生の CDC のレコード(受け取ったバイト列のまま。顧客名などを含む)。出力と同じ confidential、保持は 7 日
_cdc.legacy.public.t_juchu.dlq 3 cleanup.policy=delete,retention.ms=604800000 confidential
# INT-INVENTORY-001(ADR-0028 §2): 処理できない在庫のコマンド。元のメッセージと同じ internal、保持は 7 日(ADR-0029 §5 の印の保持期間の根拠)
inventory.stock.cmd-reserve.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 internal
inventory.stock.cmd-release.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 internal
# INT-INVENTORY-001(ADR-0006・ADR-0029 §5): 在庫のコマンド。Orchestrator(order)の Outbox から Debezium が書く。保持は 7 日(印の保持期間の根拠)
inventory.stock.cmd-reserve.v1 3 cleanup.policy=delete,retention.ms=604800000 internal
inventory.stock.cmd-release.v1 3 cleanup.policy=delete,retention.ms=604800000 internal
# INT-PAYMENT-001(ADR-0006・ADR-0029 §5): 決済のコマンド(顧客 ID・金額を含む confidential)。保持は 7 日(印の保持期間の根拠)
payment.payment.cmd-authorize.v1 3 cleanup.policy=delete,retention.ms=604800000 confidential
payment.payment.cmd-void.v1 3 cleanup.policy=delete,retention.ms=604800000 confidential
payment.payment.cmd-authorize.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 confidential
payment.payment.cmd-void.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 confidential
# INT-SHIPPING-001(ADR-0006・ADR-0029 §5): 出荷のコマンド(届け先の住所を含む confidential)。保持は 7 日(印の保持期間の根拠)
shipping.shipment.cmd-arrange.v1 3 cleanup.policy=delete,retention.ms=604800000 confidential
shipping.shipment.cmd-cancel.v1 3 cleanup.policy=delete,retention.ms=604800000 confidential
shipping.shipment.cmd-arrange.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 confidential
shipping.shipment.cmd-cancel.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 confidential
