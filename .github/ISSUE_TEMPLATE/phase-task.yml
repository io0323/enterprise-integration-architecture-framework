name: Phase Task
description: ROADMAP のフェーズ内タスク
labels: ["type:feature"]
body:
  - type: input
    id: phase
    attributes: { label: Phase, placeholder: P05 }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: 目的 / 背景 }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 実装スコープ }
  - type: textarea
    id: dod
    attributes: { label: Definition of Done }
    validations: { required: true }
  - type: input
    id: chapters
    attributes: { label: Framework 参照章, placeholder: "5, 13" }
