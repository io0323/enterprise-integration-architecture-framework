# b2b.rules.yml の単体テスト(promtool test rules。make alerts-test)。
# promtool の time() は評価の時刻(UNIX 秒。テストの開始が 0)なので、期限(UNIX 秒)は「開始からの秒数」で書く。
rule_files:
  - b2b.rules.yml

evaluation_interval: 1m

tests:
  - name: 期限まで 1 時間を切ったら警告、過ぎたら重大。余裕があれば出さない
    interval: 1m
    input_series:
      # p1: 4 時間後、p2: 40 分後、p3: 開始から 10 分後(評価の時点で過ぎている)
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p1"}'
        values: "14400x30"
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p2"}'
        values: "2400x30"
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p3"}'
        values: "600x30"
    alert_rule_test:
      - eval_time: 3m
        alertname: B2bAperakDeadlineApproaching
        exp_alerts: []
      - eval_time: 20m
        alertname: B2bAperakDeadlineApproaching
        exp_alerts:
          - exp_labels: { severity: warning, trading_partner_id: p2 }
            exp_annotations:
              summary: "取引先 p2 の業務の応答(APERAK)の期限まで 1 時間を切った注文が、社内への取り込みを待っている"
              runbook: docs/runbooks/b2b-partner-credentials.md#社内への取り込み
      - eval_time: 20m
        alertname: B2bAperakDeadlinePassed
        exp_alerts:
          - exp_labels: { severity: critical, trading_partner_id: p3 }
            exp_annotations:
              summary: "取引先 p3 の業務の応答(APERAK)の期限を過ぎた注文が、社内への取り込みを待っている"
              runbook: docs/runbooks/b2b-partner-credentials.md#社内への取り込み

  - name: 送信待ちがなくなれば(系列が消えれば)、期限のアラートは消える
    interval: 1m
    input_series:
      - series: 'eia_b2b_order_submission_aperak_deadline_seconds{job="b2b-gateway",trading_partner_id="p1"}'
        values: "600x20 _x10"
    alert_rule_test:
      - eval_time: 18m
        alertname: B2bAperakDeadlinePassed
        exp_alerts:
          - exp_labels: { severity: critical, trading_partner_id: p1 }
            exp_annotations:
              summary: "取引先 p1 の業務の応答(APERAK)の期限を過ぎた注文が、社内への取り込みを待っている"
              runbook: docs/runbooks/b2b-partner-credentials.md#社内への取り込み
      - eval_time: 30m
        alertname: B2bAperakDeadlinePassed
        exp_alerts: []

  - name: 送り直しの上限を過ぎた注文があれば、すぐに重大。なければ出さない
    interval: 1m
    input_series:
      - series: 'eia_b2b_order_submission_expired{job="b2b-gateway",trading_partner_id="p1"}'
        values: "0x5 1x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: B2bOrderSubmissionExpired
        exp_alerts: []
      - eval_time: 8m
        alertname: B2bOrderSubmissionExpired
        exp_alerts:
          - exp_labels: { severity: critical, trading_partner_id: p1 }
            exp_annotations:
              summary: "取引先 p1 の注文が、送り直しの上限を過ぎて社内に取り込めなかった(手の対応が要る)"
              runbook: docs/runbooks/b2b-partner-credentials.md#送り直しの上限を過ぎた注文
