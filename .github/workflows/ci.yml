# P00 で Claude Code が完成させる雛形
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (lint, detekt, unit, architecture tests)
        run: |
          if [ -f ./gradlew ]; then ./gradlew build --no-daemon; else echo "gradle not bootstrapped yet"; fi
