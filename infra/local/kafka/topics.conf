# アプリが書くトピックの定義(auto.create.topics.enable=false のため、明示的に作る。ADR-0016・ADR-0026)。
# compose の kafka-topics(1 回だけ動くコンテナ。create-topics.sh)と、統合テスト(legacy-order-acl の app)が同じこのファイルを読む。
# Debezium が書くトピック(生の CDC・Outbox の発行先)はコネクタの topic.creation.* で作るので、原則ここには書かない。
# 例外: 注文 Saga のコマンドのトピックは、保持期間(7 日)が「取消済み」の印の保持期間の根拠なので(ADR-0029 §5)、ここで明示して作る
# (Debezium は既にあるトピックをそのまま使う)。注文のイベントも、保持期間(14 日)が分析のバッチの回復の前提なので、ここで作る(ADR-0031 §7)。
#
# 形式: トピック名 パーティション数 設定(key=value のカンマ区切り) 機密区分(カタログの dataClassification)
# - Kafka のトピックの設定には機密区分を書けないため、最後の列で持つ(読み取りの権限の制御は secure profile の #26)。
# - 既にあるトピックは、設定だけをこのファイルの値にそろえる(パーティション数は増やさない・減らせない)。
#
# INT-SALES-002(ADR-0031 §7): 注文のイベント。order-service の Outbox から Debezium が書く(既にあればそのまま使う)。
# 保持は 14 日: 分析のバッチ(batch-etl。日次の取り込み)が止まりうる最も長い期間(連休で最大 9 日)と、週次の照合の間隔(7 日)の
# どちらより長くする。止まっている間・照合でずれを見つけるまでの間に、取り込み残しのイベントが消えないように。
# 受け付けは届け先の住所を含むので confidential。DLQ(読めない値)も同じ保持・機密区分
sales.order.created.v1 3 cleanup.policy=delete,retention.ms=1209600000 confidential
sales.order.cancelled.v1 3 cleanup.policy=delete,retention.ms=1209600000 confidential
sales.order.status-changed.v1 3 cleanup.policy=delete,retention.ms=1209600000 confidential
sales.order.created.v1.dlq 3 cleanup.policy=delete,retention.ms=1209600000 confidential
sales.order.cancelled.v1.dlq 3 cleanup.policy=delete,retention.ms=1209600000 confidential
sales.order.status-changed.v1.dlq 3 cleanup.policy=delete,retention.ms=1209600000 confidential
# INT-SALES-003(ADR-0026 §9): 注文のヘッダの最新の状態。compacted。tombstone は 1 日残す(契約の AsyncAPI の消費者の条件)
sales.legacy-order.changed.v1 3 cleanup.policy=compact,delete.retention.ms=86400000 confidential
# ADR-0026 §7: 変換できない生の CDC のレコード(受け取ったバイト列のまま。顧客名などを含む)。出力と同じ confidential、保持は 7 日
_cdc.legacy.public.t_juchu.dlq 3 cleanup.policy=delete,retention.ms=604800000 confidential
