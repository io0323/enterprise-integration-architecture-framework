# slo.rules.yml の単体テスト(make alerts-test。CI の infra で動く)。時間を測るテストではなく、ルールの式と閾値を確かめる。
rule_files:
  - slo.rules.yml
evaluation_interval: 1m
tests:
  - name: order-api の可用性。予算の 14.4 倍を超える誤り(約 2%)は 5 分ほどで critical
    interval: 1m
    input_series:
      - series: 'apisix_http_status{route="sales-order-api",code="200"}'
        values: "0+1000x400"
      - series: 'apisix_http_status{route="sales-order-api",code="500"}'
        values: "0+20x400"
    alert_rule_test:
      - eval_time: 1m
        alertname: SloBurnRateFast
        exp_alerts: []
      - eval_time: 10m
        alertname: SloBurnRateFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: order-api-availability }
            exp_annotations:
              summary: "SLO order-api-availability の誤差の予算を 14.4 倍の速さで使っている(誤りの割合 1.961%)"
              runbook: docs/runbooks/slo.md#予算を速く使っているとき
      - eval_time: 10m
        alertname: SloBurnRateSlow
        exp_alerts: []
      - eval_time: 30m
        alertname: SloBurnRateSlow
        exp_alerts:
          - exp_labels: { severity: warning, slo: order-api-availability }
            exp_annotations:
              summary: "SLO order-api-availability の誤差の予算を 6 倍の速さで使っている(誤りの割合 1.961%)"
              runbook: docs/runbooks/slo.md#予算をゆっくり使っているとき
  - name: order-api の可用性。予算の 6 倍と 14.4 倍の間の誤り(約 0.5%)は warning だけ
    interval: 1m
    input_series:
      - series: 'apisix_http_status{route="sales-order-api",code="200"}'
        values: "0+1000x400"
      - series: 'apisix_http_status{route="sales-order-api",code="500"}'
        values: "0+5x400"
    alert_rule_test:
      - eval_time: 60m
        alertname: SloBurnRateFast
        exp_alerts: []
      - eval_time: 60m
        alertname: SloBurnRateSlow
        exp_alerts:
          - exp_labels: { severity: warning, slo: order-api-availability }
            exp_annotations:
              summary: "SLO order-api-availability の誤差の予算を 6 倍の速さで使っている(誤りの割合 0.4975%)"
              runbook: docs/runbooks/slo.md#予算をゆっくり使っているとき
  - name: order-api の可用性。予算の 6 倍より少ない誤り(0.1%)では発火しない
    interval: 1m
    input_series:
      - series: 'apisix_http_status{route="sales-order-api",code="200"}'
        values: "0+1000x400"
      - series: 'apisix_http_status{route="sales-order-api",code="500"}'
        values: "0+1x400"
    alert_rule_test:
      - eval_time: 120m
        alertname: SloBurnRateFast
        exp_alerts: []
      - eval_time: 120m
        alertname: SloBurnRateSlow
        exp_alerts: []
  - name: 回復すると、長い窓に誤りが残っていても、短い窓で速い消費のアラートが消える
    interval: 1m
    input_series:
      - series: 'apisix_http_status{route="sales-order-api",code="200"}'
        values: "0+1000x400"
      - series: 'apisix_http_status{route="sales-order-api",code="500"}'
        values: "0+20x20 400x380"
    alert_rule_test:
      - eval_time: 15m
        alertname: SloBurnRateFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: order-api-availability }
            exp_annotations:
              summary: "SLO order-api-availability の誤差の予算を 14.4 倍の速さで使っている(誤りの割合 1.961%)"
              runbook: docs/runbooks/slo.md#予算を速く使っているとき
      - eval_time: 40m
        alertname: SloBurnRateFast
        exp_alerts: []
  - name: 5xx が 1 件もないとき、誤りの割合は「データなし」ではなく 0(本物の平常時の形)
    interval: 1m
    input_series:
      - series: 'apisix_http_status{route="sales-order-api",code="200"}'
        values: "0+1000x60"
      - series: 'apisix_http_latency_bucket{route="sales-order-api",type="request",le="500.0"}'
        values: "0+1000x60"
      - series: 'apisix_http_latency_count{route="sales-order-api",type="request"}'
        values: "0+1000x60"
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="order-api-availability"}
        eval_time: 10m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{slo="order-api-availability"}'
            value: 0
      - expr: slo:error_ratio:rate5m{slo="order-api-latency"}
        eval_time: 10m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{slo="order-api-latency"}'
            value: 0
    alert_rule_test:
      - eval_time: 30m
        alertname: SloBurnRateFast
        exp_alerts: []

  - name: order のイベントの発行。累積の統計(MaxValue・P99)が大きくても、現在の遅れで判定する(本物の形)
    interval: 1m
    input_series:
      - series: 'debezium_postgres_streaming_connected{job="kafka-connect",server="order-outbox"}'
        values: "1x60"
      - series: 'debezium_postgres_streaming_millisecondsbehindsource{job="kafka-connect",server="order-outbox",_objectname="debezium.postgres<type=connector-metrics, context=streaming, server=order-outbox><>MilliSecondsBehindSource"}'
        values: "1000x60"
      - series: 'debezium_postgres_streaming_millisecondsbehindsource{job="kafka-connect",server="order-outbox",_objectname="debezium.postgres<type=connector-metrics, context=streaming, server=order-outbox><>MilliSecondsBehindSourceMaxValue"}'
        values: "86180x60"
      - series: 'debezium_postgres_streaming_millisecondsbehindsource{job="kafka-connect",server="order-outbox",_objectname="debezium.postgres<type=connector-metrics, context=streaming, server=order-outbox><>MilliSecondsBehindSourceP99"}'
        values: "77591x60"
    promql_expr_test:
      - expr: slo:error_ratio:rate5m{slo="order-events-publish"}
        eval_time: 10m
        exp_samples:
          - labels: 'slo:error_ratio:rate5m{slo="order-events-publish"}'
            value: 0

  - name: 流量がないと割合は計算できず、発火しない
    interval: 1m
    input_series:
      - series: 'apisix_http_status{route="sales-order-api",code="200"}'
        values: "100x100"
      - series: 'apisix_http_status{route="sales-order-api",code="500"}'
        values: "100x100"
    alert_rule_test:
      - eval_time: 90m
        alertname: SloBurnRateFast
        exp_alerts: []
  - name: order-api の遅延。500ms を超える割合が 20%(予算 1% の 20 倍)なら critical
    interval: 1m
    input_series:
      - series: 'apisix_http_latency_bucket{route="sales-order-api",type="request",le="500.0"}'
        values: "0+800x100"
      - series: 'apisix_http_latency_count{route="sales-order-api",type="request"}'
        values: "0+1000x100"
    alert_rule_test:
      - eval_time: 10m
        alertname: SloBurnRateFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: order-api-latency }
            exp_annotations:
              summary: "SLO order-api-latency の誤差の予算を 14.4 倍の速さで使っている(誤りの割合 20%)"
              runbook: docs/runbooks/slo.md#予算を速く使っているとき
  - name: storefront の可用性と遅延(それぞれの route と le で数える)
    interval: 1m
    input_series:
      - series: 'apisix_http_status{route="storefront-graphql",code="200"}'
        values: "0+1000x400"
      - series: 'apisix_http_status{route="storefront-graphql",code="503"}'
        values: "0+20x400"
      - series: 'apisix_http_latency_bucket{route="storefront-graphql",type="request",le="1000.0"}'
        values: "0+800x100"
      - series: 'apisix_http_latency_count{route="storefront-graphql",type="request"}'
        values: "0+1000x100"
    alert_rule_test:
      - eval_time: 10m
        alertname: SloBurnRateFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: storefront-availability }
            exp_annotations:
              summary: "SLO storefront-availability の誤差の予算を 14.4 倍の速さで使っている(誤りの割合 1.961%)"
              runbook: docs/runbooks/slo.md#予算を速く使っているとき
          - exp_labels: { severity: critical, slo: storefront-latency }
            exp_annotations:
              summary: "SLO storefront-latency の誤差の予算を 14.4 倍の速さで使っている(誤りの割合 20%)"
              runbook: docs/runbooks/slo.md#予算を速く使っているとき
  - name: order のイベントの発行。5 秒を超えて遅れていれば critical
    interval: 1m
    input_series:
      - series: 'debezium_postgres_streaming_connected{server="order-outbox"}'
        values: "1x60"
      - series: 'debezium_postgres_streaming_millisecondsbehindsource{server="order-outbox",_objectname="x><>MilliSecondsBehindSource"}'
        values: "6000x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: SloBurnRateFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: order-events-publish }
            exp_annotations:
              summary: "SLO order-events-publish の誤差の予算を 14.4 倍の速さで使っている(誤りの割合 100%)"
              runbook: docs/runbooks/slo.md#予算を速く使っているとき

  - name: order のイベントの発行。接続が切れていれば、遅れが小さくても critical
    interval: 1m
    input_series:
      - series: 'debezium_postgres_streaming_connected{server="order-outbox"}'
        values: "0x60"
      - series: 'debezium_postgres_streaming_millisecondsbehindsource{server="order-outbox",_objectname="x><>MilliSecondsBehindSource"}'
        values: "100x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: SloBurnRateFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: order-events-publish }
            exp_annotations:
              summary: "SLO order-events-publish の誤差の予算を 14.4 倍の速さで使っている(誤りの割合 100%)"
              runbook: docs/runbooks/slo.md#予算を速く使っているとき

  - name: order のイベントの発行。接続していて 5 秒以内なら発火しない
    interval: 1m
    input_series:
      - series: 'debezium_postgres_streaming_connected{server="order-outbox"}'
        values: "1x60"
      - series: 'debezium_postgres_streaming_millisecondsbehindsource{server="order-outbox",_objectname="x><>MilliSecondsBehindSource"}'
        values: "1000x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: SloBurnRateFast
        exp_alerts: []
  - name: 呼び出し元の締め切りでの打ち切りが、試行の 1% を超えて 10 分続いたら warning(依存先ごと)
    interval: 1m
    input_series:
      - series: 'eia_resilience_attempts_total{job="bff-graphql",eia_dependency_name="inventory"}'
        values: "0+100x60"
      - series: 'eia_resilience_timeouts_total{job="bff-graphql",eia_dependency_name="inventory",kind="caller_deadline"}'
        values: "0+2x60"
      - series: 'eia_resilience_attempts_total{job="bff-graphql",eia_dependency_name="shipping"}'
        values: "0+100x60"
      - series: 'eia_resilience_timeouts_total{job="bff-graphql",eia_dependency_name="shipping",kind="caller_deadline"}'
        values: "0+0.5x60"
      - series: 'eia_resilience_timeouts_total{job="bff-graphql",eia_dependency_name="shipping",kind="attempt"}'
        values: "0+50x60"
    alert_rule_test:
      - eval_time: 5m
        alertname: CallerDeadlineHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: CallerDeadlineHigh
        exp_alerts:
          - exp_labels: { severity: warning, job: bff-graphql, eia_dependency_name: inventory }
            exp_annotations:
              summary: "bff-graphql の inventory の呼び出しの 2% が、呼び出し元の締め切りで打ち切られている"
              runbook: docs/runbooks/slo.md#呼び出し元の締め切りで打ち切られているとき
