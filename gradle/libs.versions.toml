# バージョンは実装時点の最新安定版を確認して固定する(alpha / beta / RC は使わない)。
# 確認日: 2026-09-25(P00)
[versions]
kotlin = "2.4.20"
ksp = "2.3.12"
kotest = "6.2.5"
konsist = "0.17.3"
# detekt 2.x は alpha のみのため 1.23 系の最新安定版を使う。
detekt = "1.23.8"
# detekt 1.23.8 がビルドされた Kotlin。detekt 実行用クラスパスだけをこの版に揃える(ビルド本体の Kotlin とは独立)。
detekt-kotlin = "2.0.21"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
kover = "0.9.9"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
ktor = "3.6.0"
koin = "4.2.2"
exposed = "1.5.0"
mockk = "1.14.11"
testcontainers = "2.0.5"
# P02 contract-check(確認日: 2026-09-26)
avro = "1.12.2"
swagger-parser = "2.1.48"
# json-schema-validator 3.x は Jackson 3(tools.jackson)を使う。swagger-parser の Jackson 2(com.fasterxml.jackson)とはパッケージが別なので共存できる。
json-schema-validator = "3.0.7"
jackson3 = "3.2.3"
# slf4j-api の 2.0 系の最新安定版(2.1 系は alpha のみ)。contract-check は nop、platform/observability は logback で出力する。
slf4j = "2.0.20"
# 外部 CLI。tools/contract-check の build.gradle.kts がチェックサムを検証して取得する(ADR-0013)。
oasdiff = "1.32.1"
# P04a ② observability(確認日: 2026-09-27。ADR-0018)
# OTel の計装ライブラリ(opentelemetry-instrumentation の logback / ktor / kafka / jdbc)は 2.31.1-alpha のみのため使わない(ADR-0018 §4)。
opentelemetry = "1.66.0"
opentelemetry-semconv = "1.44.0"
logback = "1.6.4"
# P04a ③ security(確認日: 2026-09-27。ADR-0019)
# JWT の検証と JWKS の取得・キャッシュ。推移的な依存を持たない。ktor-server-auth-jwt(auth0)は使わない(ADR-0019 §1)。
nimbus-jose-jwt = "10.10"
# Kotlin/JS のテストランナー(mocha。Kotlin の Gradle プラグインが入れる)の間接的な依存を、脆弱性の修正版に上げる(確認日: 2026-09-28)。
# eia.root が yarn.resolution に渡す。mocha 11.7.6 は serialize-javascript ^6.0.2 と diff ^7.0.0 を要求するが、修正版はメジャー版が上がる。
# - serialize-javascript: GHSA-5c6j-r48x-rmvq(< 7.0.3)と GHSA-qj8w-gfj5-8c6v(< 7.0.5)
# - diff: GHSA-73rr-hh4g-fpgx(< 8.0.3)。9.x は CommonJS の入口がないため、mocha の require と両立する 8.x の最新にする
npm-serialize-javascript = "7.1.2"
npm-diff = "8.0.4"
# P04a ④ audit(確認日: 2026-09-28。ADR-0017)
flyway = "13.8.0"
postgresql = "42.7.13"
# S3 クライアント。HTTP の実装は JDK の HttpURLConnection(url-connection-client)で、Netty・Apache・CRT を持ち込まない(ADR-0017)
aws-sdk = "2.55.6"
# 統合テストの計測(並列の追記)でだけ使うコネクションプール
hikaricp = "7.1.0"

[libraries]
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
# P05 ②a: Problem Details(RFC 9457)で例外と 404 / 405 を応答する(platform/api。ADR-0022)
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
# Toxiproxy の障害注入(ToxiproxyContainer と toxiproxy-java 2.1.11)。イメージは InfraImages の TOXIPROXY_IMAGE(ADR-0016 §5)
testcontainers-toxiproxy = { module = "org.testcontainers:testcontainers-toxiproxy", version.ref = "testcontainers" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swagger-parser" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jackson3-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson3" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
# OTLP の送信に JDK の HttpClient を使う(既定の OkHttp の送信部と、それが引き込む Kotlin stdlib の版の衝突を避ける)
opentelemetry-exporter-sender-jdk = { module = "io.opentelemetry:opentelemetry-exporter-sender-jdk", version.ref = "opentelemetry" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
opentelemetry-semconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version.ref = "opentelemetry-semconv" }

# build-logic が convention plugin から適用するプラグインの実体
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
gradle-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
gradle-kotest = { module = "io.kotest:io.kotest.gradle.plugin", version.ref = "kotest" }
gradle-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradle-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
gradle-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
