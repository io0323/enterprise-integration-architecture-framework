# INT-INTEGRATION-001(ADR-0035 §3): 社内の取り込みのトピック。webhook-receiver の Outbox から Debezium が書く(既にあればそのまま使う)。
# 本文(顧客の名前・メール)をそのまま運ぶので confidential。保持は 7 日(カタログの dataRetention: P7D と一致させる)。
# integration-flow が止まったときの再処理に足り、個人情報を長く持たない長さ。DLQ(写せない・Canonical の検証を通らない Webhook)も同じ
integration.crm-webhook.received.v1 3 cleanup.policy=delete,retention.ms=604800000 confidential
integration.crm-webhook.received.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 confidential
# INT-SALES-007(ADR-0036): Canonical の顧客のイベント。integration-flow の Outbox から Debezium が書く。名前・メール・住所を含むので confidential。
# 保持は 7 日(消費者が止まったときの再処理に足りる長さ。顧客の全体を毎回運ぶので、長く持つ必要がない)
sales.customer.changed.v1 3 cleanup.policy=delete,retention.ms=604800000 confidential
# INT-IOT-002(ADR-0039): デバイスのテレメトリ。iot-bridge が直接書く(DB を持たないので Outbox ではない)。キーは {tenant}/{deviceId}。
# 保持は 7 日(消費者が止まったときの再処理に足りる長さ)。保持期間の起点は iot-bridge が受け取った時刻(レコードの時刻。§7)
iot.telemetry.reported.v1 3 cleanup.policy=delete,retention.ms=604800000 internal
# DLQ: 受け付けない形式の版・形式の誤り。値は MQTT から受け取った JSON のまま(Avro ではない。iot-bridge reprocess-dlq で処理し直す。§4)
iot.telemetry.reported.v1.dlq 3 cleanup.policy=delete,retention.ms=604800000 internal
