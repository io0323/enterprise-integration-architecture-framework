id: INT-SALES-001
name: Order API
description: 注文の登録と参照(Gateway 公開パス /sales/v1/orders)
style: rest
pattern: request-reply
provider: { owner: team-order, system: order-service }
consumers:
  # 画面のための集約(GET /sales/v1/orders?ids=。sales.order:read だけ。P13。ADR-0043)
  - { owner: team-storefront, system: bff-graphql }
  # 日次の集計(GET /v1/order-summaries/daily/{date}。sales.order:report)を、分析の週次の照合で読む(P08。ADR-0031)
  - { owner: team-analytics, system: batch-etl }
  # 取引先から受け付けた注文(EDI。INT-B2B-001)を登録する(POST /sales/v1/orders。sales.order:write。Client Credentials のクライアント
  # eiaf-b2b-gateway)。Idempotency-Key は b2b:{取引先}:{交換の管理番号}:{メッセージの参照番号}(P12。ADR-0040 §6)
  - { owner: team-integration, system: b2b-gateway }
contract: contracts/openapi/order-api.v1.yaml
tier: 1
dataClassification: confidential
slo: { availability: "99.95", latencyP99: "500ms" }
# 監査の記録(ADR-0017 §1)。誰が = 呼び出し元のクライアント(azp)。本文は記録せず、正規化した本文の SHA-256 だけを残す
audit: { actions: [order.create, order.republish], dataClassification: confidential, retention: legal }
lifecycle: active
